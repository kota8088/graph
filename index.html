<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グラフ作成サイト</title>

  <!-- ファビコン（絵文字SVG） -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- 箱ひげ図プラグイン -->
  <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.2.0/dist/chartjs-chart-boxplot.min.js"></script>
  <!-- ヒートマップ（マトリックス）プラグイン -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.1.0/dist/chartjs-chart-matrix.min.js"></script>
  <!-- サンキーダイアグラム プラグイン -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@0.12.0/dist/chartjs-chart-sankey.min.js"></script>

  <style>
    /* ===== cybertpunkネオン風ダークテーマ ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0a0e17;
      color: #e0e5ff;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
    }

    /* 全体をフルスクリーンに固定 */
    .cyber-graph-generator {
      width: 100vw;
      height: 100vh;
      background: #0a0e17;
      color: #e0e5ff;
      overflow: hidden;
    }

    .cyber-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      margin: 0 auto;
    }

    /* ===== 左パネル ===== */
    .cyber-control-panel {
      width: 400px;
      background: rgba(10, 15, 30, 0.92);
      border-right: 2px solid #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
      padding: 20px;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 2;
      backdrop-filter: blur(4px);
    }

    .cyber-panel-title {
      font-size: 1.6rem;
      margin: 0 0 16px 0;
      background: linear-gradient(90deg, #00f0ff, #ff00a0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    .cyber-field-group {
      margin-bottom: 18px;
    }

    .cyber-label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #00f0ff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .cyber-input,
    .cyber-select {
      width: 100%;
      padding: 10px 12px;
      background: #141a2e;
      border: 1px solid #2a3a55;
      color: #e0e5ff;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .cyber-input:focus,
    .cyber-select:focus {
      outline: none;
      border-color: #ff00a0;
      box-shadow: 0 0 12px rgba(255, 0, 160, 0.3);
    }

    .cyber-input::placeholder {
      color: #6b7f9c;
    }

    /* モード切替ラジオ */
    .cyber-mode-switch {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      padding: 10px;
      background: #11182a;
      border-radius: 30px;
      border: 1px solid #00f0ff;
    }

    .cyber-mode-label {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      border-radius: 30px;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cyber-mode-label input[type="radio"] {
      display: none;
    }

    .cyber-mode-text {
      color: #8fa3c8;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .cyber-mode-label input:checked + .cyber-mode-text {
      color: #fff;
      text-shadow: 0 0 8px #00f0ff;
    }

    .cyber-mode-label:has(input:checked) {
      background: linear-gradient(135deg, #00f0ff30, #ff00a030);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    /* セクション見出し */
    .cyber-section-header {
      margin: 20px 0 10px;
      border-bottom: 1px solid #2a3a55;
      padding-bottom: 6px;
    }

    .cyber-section-title {
      font-size: 0.9rem;
      color: #ff00a0;
      letter-spacing: 1px;
    }

    /* データ行 */
    .cyber-data-list,
    .cyber-histogram-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .cyber-data-row,
    .cyber-histogram-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .cyber-data-row .cyber-input,
    .cyber-histogram-row .cyber-input {
      flex: 1;
    }

    .cyber-remove-row {
      background: transparent;
      border: 1px solid #ff007a;
      color: #ff007a;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .cyber-remove-row:hover {
      background: #ff007a;
      color: #fff;
      box-shadow: 0 0 12px #ff007a;
    }

    .cyber-add-row-btn,
    .cyber-sort-btn,
    .cyber-download-btn {
      background: transparent;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.5px;
    }

    .cyber-add-row-btn:hover,
    .cyber-sort-btn:hover,
    .cyber-download-btn:hover {
      background: #00f0ff;
      color: #0a0e17;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
    }

    .cyber-histogram-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* ヒストグラム用ラベル（下限・度数） */
    .cyber-bin-label {
      font-size: 0.75rem;
      color: #8fa3c8;
      text-transform: uppercase;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* 統計結果テーブル */
    .cyber-stats-section {
      margin-top: 18px;
    }

    .cyber-stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }

    .cyber-stats-table th,
    .cyber-stats-table td {
      padding: 8px 6px;
      text-align: center;
      border: 1px solid #2a3a55;
      color: #c0d1f5;
    }

    .cyber-stats-table th {
      background: #141a2e;
      color: #00f0ff;
      font-weight: 600;
    }

    .cyber-stats-table td {
      background: #0d1425;
    }

    /* ダウンロードボタン */
    .cyber-download-section {
      margin-top: 24px;
      text-align: center;
    }

    /* ===== 右側モニター ===== */
    .cyber-monitor {
      flex: 1;
      background: #0a0e17;
      display: flex;
      flex-direction: column;
      padding: 20px 30px;
      position: relative;
      overflow: hidden;
    }

    .cyber-chart-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .cyber-chart-title-display {
      font-size: 1.5rem;
      font-weight: 600;
      background: linear-gradient(135deg, #00f0ff, #ff00a0);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      letter-spacing: 1px;
    }

    .cyber-chart-wrapper {
      flex: 1;
      background: #0a0e17;
      border: 1px solid #1e2c45;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
      padding: 16px;
      min-height: 0;
    }

    .cyber-chart-wrapper canvas {
      width: 100% !important;
      height: 100% !important;
      max-height: 100%;
    }

    /* ===== レスポンシブ（スマホ） ===== */
    @media (max-width: 700px) {
      body {
        overflow: auto;
      }

      .cyber-graph-generator {
        height: auto;
        min-height: 100vh;
      }

      .cyber-layout {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .cyber-control-panel {
        width: 100%;
        max-height: 45vh;
        overflow-y: auto;
        border-right: none;
        border-bottom: 2px solid #ff00a0;
        box-shadow: 0 0 20px rgba(255, 0, 160, 0.3);
      }

      .cyber-monitor {
        width: 100%;
        height: 55vh;
        min-height: 400px;
        padding: 10px;
      }

      .cyber-chart-wrapper {
        padding: 8px;
      }

      .cyber-mode-switch {
        flex-direction: column;
      }
    }

    /* スクロールバー（見た目調整） */
    .cyber-control-panel::-webkit-scrollbar {
      width: 6px;
    }

    .cyber-control-panel::-webkit-scrollbar-track {
      background: #0a0e17;
    }

    .cyber-control-panel::-webkit-scrollbar-thumb {
      background: #00f0ff66;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <section class="cyber-graph-generator" id="cyberGraphGenerator">
    <div class="cyber-layout">

      <!-- ======= 左：操作・データ入力パネル ======= -->
      <aside class="cyber-control-panel" id="cyberControlPanel">
        <h2 class="cyber-panel-title">📊 グラフ作成サイト</h2>

        <!-- モード切替 -->
        <div class="cyber-mode-switch" role="radiogroup" aria-label="データ入力モード">
          <label class="cyber-mode-label">
            <input type="radio" name="cyberInputMode" value="normal" id="cyberInputModeNormal" checked>
            <span class="cyber-mode-text">通常データ入力</span>
          </label>
          <label class="cyber-mode-label">
            <input type="radio" name="cyberInputMode" value="histogram" id="cyberInputModeHistogram">
            <span class="cyber-mode-text">度数分布表入力</span>
          </label>
        </div>

        <!-- グラフタイトル -->
        <div class="cyber-field-group">
          <label class="cyber-label" for="cyberChartTitle">グラフタイトル</label>
          <input type="text" id="cyberChartTitle" class="cyber-input" placeholder="グラフタイトルを入力" value="サンプルグラフ">
        </div>

        <!-- グラフ種類 -->
        <div class="cyber-field-group">
          <label class="cyber-label" for="cyberChartType">グラフの種類（12種）</label>
          <select id="cyberChartType" class="cyber-select">
            <option value="bar">棒グラフ</option>
            <option value="line">折れ線グラフ</option>
            <option value="pie">円グラフ</option>
            <option value="horizontalBar">帯グラフ（横向き積み上げ棒グラフ）</option>
            <option value="histogram">ヒストグラム（柱状グラフ ※度数分布表と連動）</option>
            <option value="scatter">散布図</option>
            <option value="stackedBar">積み上げ棒グラフ</option>
            <option value="radar">レーダーチャート</option>
            <option value="bubble">バブルチャート</option>
            <option value="boxplot">箱ひげ図</option>
            <option value="heatmap">ヒートマップ</option>
            <option value="sankey">サンキーダイアグラム</option>
          </select>
        </div>

        <!-- ===== 通常データ入力モード ===== -->
        <div id="cyberNormalDataArea" data-cyber-mode-panel="normal">
          <div class="cyber-section-header">
            <span class="cyber-section-title">データ入力（項目名と数値）</span>
          </div>
          <div class="cyber-data-list" id="cyberNormalDataList">
            <div class="cyber-data-row">
              <input type="text" class="cyber-data-label cyber-input" placeholder="項目名" value="A">
              <input type="number" class="cyber-data-value cyber-input" placeholder="数値" value="10" step="any">
              <button type="button" class="cyber-remove-row" aria-label="行を削除">×</button>
            </div>
            <div class="cyber-data-row">
              <input type="text" class="cyber-data-label cyber-input" placeholder="項目名" value="B">
              <input type="number" class="cyber-data-value cyber-input" placeholder="数値" value="20" step="any">
              <button type="button" class="cyber-remove-row" aria-label="行を削除">×</button>
            </div>
          </div>
          <button type="button" class="cyber-add-row-btn" id="cyberAddNormalRow">＋ 行を追加</button>
        </div>

        <!-- ===== 度数分布表入力モード ===== -->
        <div id="cyberHistogramArea" data-cyber-mode-panel="histogram" hidden>
          <div class="cyber-section-header">
            <span class="cyber-section-title">度数分布表入力</span>
          </div>

          <div class="cyber-field-group">
            <label class="cyber-label" for="cyberBinWidth">階級の幅（刻み幅）</label>
            <input type="number" id="cyberBinWidth" class="cyber-input" value="10" min="1" step="any">
          </div>

          <div class="cyber-histogram-list" id="cyberHistogramList">
            <div class="cyber-histogram-row">
              <span class="cyber-bin-label">下限値</span>
              <input type="number" class="cyber-bin-lower cyber-input" placeholder="例: 0" value="0" step="any">
              <span class="cyber-bin-label">度数</span>
              <input type="number" class="cyber-bin-count cyber-input" placeholder="例: 5" value="5" min="0" step="1">
              <button type="button" class="cyber-remove-row" aria-label="行を削除">×</button>
            </div>
            <div class="cyber-histogram-row">
              <span class="cyber-bin-label">下限値</span>
              <input type="number" class="cyber-bin-lower cyber-input" placeholder="例: 10" value="10" step="any">
              <span class="cyber-bin-label">度数</span>
              <input type="number" class="cyber-bin-count cyber-input" placeholder="例: 8" value="8" min="0" step="1">
              <button type="button" class="cyber-remove-row" aria-label="行を削除">×</button>
            </div>
          </div>

          <div class="cyber-histogram-actions">
            <button type="button" class="cyber-add-row-btn" id="cyberAddHistogramRow">＋ 階級を追加</button>
            <button type="button" class="cyber-sort-btn" id="cyberSortHistogram">▲ 低い順に並べ替え</button>
          </div>

          <!-- 統計計算テーブル -->
          <div class="cyber-stats-section">
            <div class="cyber-section-header">
              <span class="cyber-section-title">統計計算結果（自動計算）</span>
            </div>
            <table class="cyber-stats-table" id="cyberStatsTable">
              <thead>
                <tr>
                  <th>階級</th>
                  <th>度数</th>
                  <th>相対度数</th>
                  <th>百分率（％）</th>
                  <th>累積相対度数</th>
                </tr>
              </thead>
              <tbody id="cyberStatsBody">
                <!-- JSで行が生成されます -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- PNGダウンロード -->
        <div class="cyber-download-section">
          <button type="button" class="cyber-download-btn" id="cyberDownloadPng">⬇ PNGダウンロード</button>
        </div>
      </aside>

      <!-- ======= 右：グラフモニター ======= -->
      <main class="cyber-monitor" id="cyberMonitor">
        <div class="cyber-chart-header">
          <span class="cyber-chart-title-display" id="cyberChartTitleDisplay">サンプルグラフ</span>
        </div>
        <div class="cyber-chart-wrapper">
          <canvas id="cyberMainChart" aria-label="グラフ描画エリア" role="img"></canvas>
        </div>
      </main>

    </div>
  </section>

  <script>
    (function() {
      'use strict';

      // ==== プラグイン登録（正しくCDNが読み込まれた場合のみ） ====
      try {
        if (window.BoxPlotController) {
          Chart.register(BoxPlotController);
        }
        if (window.BoxPlotChart) {
          Chart.register(BoxPlotChart);
        }
        if (window.MatrixController) {
          Chart.register(MatrixController);
        }
        if (window.SankeyController) {
          Chart.register(SankeyController);
        }
      } catch (e) {
        console.warn('プラグイン登録エラー:', e);
      }

      // Chart.js 全体のテーマをダークに
      Chart.defaults.color = '#c0d1f5';
      Chart.defaults.borderColor = 'rgba(255,255,255,0.1)';

      // ==== DOM 参照 ====
      const modeNormal = document.getElementById('cyberInputModeNormal');
      const modeHist = document.getElementById('cyberInputModeHistogram');
      const normalArea = document.getElementById('cyberNormalDataArea');
      const histArea = document.getElementById('cyberHistogramArea');
      const chartTypeSelect = document.getElementById('cyberChartType');
      const chartTitleInput = document.getElementById('cyberChartTitle');
      const chartTitleDisplay = document.getElementById('cyberChartTitleDisplay');
      const canvas = document.getElementById('cyberMainChart');
      const ctx = canvas.getContext('2d');
      const downloadBtn = document.getElementById('cyberDownloadPng');
      const addNormalBtn = document.getElementById('cyberAddNormalRow');
      const addHistBtn = document.getElementById('cyberAddHistogramRow');
      const sortHistBtn = document.getElementById('cyberSortHistogram');
      const binWidthInput = document.getElementById('cyberBinWidth');

      let myChart = null;

      // ネオンカラーパレット
      const neonColors = ['#00f0ff', '#ff00a0', '#b400ff', '#00ffd9', '#ffb300', '#ff6b00', '#7cff00', '#ff007f', '#5c7cff', '#ffcc00', '#00e5ff', '#ff5588'];

      // ==== モード切替処理 ====
      function switchMode(mode) {
        if (mode === 'normal') {
          normalArea.hidden = false;
          histArea.hidden = true;
          modeNormal.checked = true;
        } else {
          normalArea.hidden = true;
          histArea.hidden = false;
          modeHist.checked = true;
        }
        updateStats();
        updateChart();
      }

      modeNormal.addEventListener('change', () => switchMode('normal'));
      modeHist.addEventListener('change', () => switchMode('histogram'));

      // ==== 行追加・削除（イベント委譲） ====
      document.addEventListener('click', function(e) {
        // 行削除
        if (e.target.classList.contains('cyber-remove-row')) {
          const container = e.target.closest('.cyber-data-list, .cyber-histogram-list');
          if (container && container.querySelectorAll('.cyber-data-row, .cyber-histogram-row').length > 1) {
            e.target.closest('.cyber-data-row, .cyber-histogram-row').remove();
          } else {
            alert('最低でも1行は必要です。');
          }
          if (container) {
            updateStats();
            updateChart();
          }
        }

        // 通常データ行追加
        if (e.target.id === 'cyberAddNormalRow') {
          const list = document.getElementById('cyberNormalDataList');
          const row = document.createElement('div');
          row.className = 'cyber-data-row';
          row.innerHTML = `
            <input type="text" class="cyber-data-label cyber-input" placeholder="項目名" value="">
            <input type="number" class="cyber-data-value cyber-input" placeholder="数値" value="0" step="any">
            <button type="button" class="cyber-remove-row" aria-label="行を削除">×</button>
          `;
          list.appendChild(row);
          updateChart();
        }

        // ヒストグラム行追加
        if (e.target.id === 'cyberAddHistogramRow') {
          const list = document.getElementById('cyberHistogramList');
          const row = document.createElement('div');
          row.className = 'cyber-histogram-row';
          row.innerHTML = `
            <span class="cyber-bin-label">下限値</span>
            <input type="number" class="cyber-bin-lower cyber-input" placeholder="例: 0" value="0" step="any">
            <span class="cyber-bin-label">度数</span>
            <input type="number" class="cyber-bin-count cyber-input" placeholder="例: 5" value="0" min="0" step="1">
            <button type="button" class="cyber-remove-row" aria-label="行を削除">×</button>
          `;
          list.appendChild(row);
          updateStats();
          updateChart();
        }
      });

      // ==== 入力変更でグラフ更新 ====
      document.addEventListener('input', function(e) {
        if (e.target.matches('.cyber-data-label, .cyber-data-value, .cyber-bin-lower, .cyber-bin-count, #cyberBinWidth, #cyberChartType, #cyberChartTitle')) {
          if (e.target.id === 'cyberChartTitle') {
            chartTitleDisplay.textContent = e.target.value || '無題';
          }
          if (e.target.classList.contains('cyber-bin-lower') || e.target.classList.contains('cyber-bin-count') || e.target.id === 'cyberBinWidth') {
            updateStats();
          }
          updateChart();
        }
      });

      // ==== ヒストグラムの並べ替え（低い順） ====
      sortHistBtn.addEventListener('click', function() {
        const list = document.getElementById('cyberHistogramList');
        const rows = Array.from(list.querySelectorAll('.cyber-histogram-row'));
        rows.sort((a, b) => {
          const av = parseFloat(a.querySelector('.cyber-bin-lower').value) || 0;
          const bv = parseFloat(b.querySelector('.cyber-bin-lower').value) || 0;
          return av - bv;
        });
        rows.forEach(row => list.appendChild(row));
        updateStats();
        updateChart();
      });

      // ==== 統計計算テーブル更新 ====
      function updateStats() {
        const statsBody = document.getElementById('cyberStatsBody');
        const binWidth = parseFloat(binWidthInput.value) || 1;
        const rows = Array.from(document.querySelectorAll('#cyberHistogramList .cyber-histogram-row'));
        const bins = rows.map(row => {
          const lower = parseFloat(row.querySelector('.cyber-bin-lower').value) || 0;
          const count = parseFloat(row.querySelector('.cyber-bin-count').value) || 0;
          return { lower, count };
        });

        // 低い順ソート
        bins.sort((a, b) => a.lower - b.lower);

        const total = bins.reduce((sum, b) => sum + b.count, 0);
        let cum = 0;
        statsBody.innerHTML = '';

        bins.forEach(bin => {
          const rel = total > 0 ? bin.count / total : 0;
          const percent = rel * 100;
          cum += bin.count;
          const cumRel = total > 0 ? cum / total : 0;
          const tr = document.createElement('tr');
          tr.className = 'cyber-stats-row';
          tr.innerHTML = `
            <td>${bin.lower} 〜 ${bin.lower + binWidth}</td>
            <td>${bin.count}</td>
            <td>${rel.toFixed(4)}</td>
            <td>${percent.toFixed(2)}%</td>
            <td>${cumRel.toFixed(4)}</td>
          `;
          statsBody.appendChild(tr);
        });
      }

      // ==== データ取得 ====
      function getChartData() {
        const mode = modeHist.checked ? 'histogram' : 'normal';
        let labels = [];
        let values = [];

        if (mode === 'normal') {
          const rows = document.querySelectorAll('#cyberNormalDataList .cyber-data-row');
          rows.forEach(row => {
            const label = row.querySelector('.cyber-data-label').value || '';
            const value = parseFloat(row.querySelector('.cyber-data-value').value) || 0;
            labels.push(label);
            values.push(value);
          });
        } else {
          const rows = document.querySelectorAll('#cyberHistogramList .cyber-histogram-row');
          const binWidth = parseFloat(binWidthInput.value) || 1;
          rows.forEach(row => {
            const lower = parseFloat(row.querySelector('.cyber-bin-lower').value) || 0;
            const count = parseFloat(row.querySelector('.cyber-bin-count').value) || 0;
            const upper = lower + binWidth;
            labels.push(`${lower}〜${upper}`);
            values.push(count);
          });
        }

        return { labels, values };
      }

      // ==== グラフ描画 ====
      function updateChart() {
        const type = chartTypeSelect.value;
        const currentTitle = chartTitleInput.value || 'グラフ';
        chartTitleDisplay.textContent = currentTitle;

        const { labels, values } = getChartData();

        if (myChart) myChart.destroy();

        if (!labels.length || !values.length) {
          return;
        }

        const colors = values.map((_, i) => neonColors[i % neonColors.length]);
        let datasets = [];
        let options = {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: currentTitle,
              color: '#a0f0ff',
              font: { size: 18 }
            },
            legend: {
              labels: { color: '#e0e5ff' }
            }
          },
          scales: {
            x: { ticks: { color: '#8fa3c8' } },
            y: { ticks: { color: '#8fa3c8' } }
          }
        };

        switch (type) {
          case 'bar':
            datasets = [{
              label: 'データ',
              data: values,
              backgroundColor: colors,
              borderColor: colors.map(c => c + 'cc'),
              borderWidth: 2
            }];
            break;

          case 'line':
            datasets = [{
              label: 'データ',
              data: values,
              borderColor: '#00f0ff',
              backgroundColor: 'rgba(0,240,255,0.1)',
              borderWidth: 2,
              pointRadius: 5,
              pointBackgroundColor: colors,
              tension: 0.3
            }];
            break;

          case 'pie':
          case 'radar':
            datasets = [{
              label: 'データ',
              data: values,
              backgroundColor: colors,
              borderColor: '#0a0e17',
              borderWidth: 2
            }];
            break;

          case 'horizontalBar':
            datasets = [{
              label: 'データ',
              data: values,
              backgroundColor: colors,
              borderColor: colors.map(c => c + 'cc'),
              borderWidth: 2
            }];
            options.indexAxis = 'y';
            break;

          case 'stackedBar':
            datasets = [{
              label: 'データ',
              data: values,
              backgroundColor: colors,
              borderColor: colors.map(c => c + 'cc'),
              borderWidth: 2,
              stack: 'stack1'
            }];
            options.scales.x.stacked = true;
            options.scales.y.stacked = true;
            break;

          case 'histogram':
            // 度数分布表データをそのまま棒グラフで描画
            datasets = [{
              label: '度数',
              data: values,
              backgroundColor: 'rgba(0, 240, 255, 0.7)',
              borderColor: '#00f0ff',
              borderWidth: 1
            }];
            options.scales.x.title = { display: true, text: '階級', color: '#8fa3c8' };
            options.scales.y.title = { display: true, text: '度数', color: '#8fa3c8' };
            break;

          case 'scatter':
            datasets = [{
              label: '散布図',
              data: labels.map((l, i) => ({ x: parseFloat(l) || i, y: values[i] })),
              backgroundColor: 'rgba(255, 0, 160, 0.7)',
              borderColor: '#ff00a0',
              borderWidth: 1,
              pointRadius: 6
            }];
            break;

          case 'bubble':
            datasets = [{
              label: 'バブルチャート',
              data: labels.map((_, i) => ({
                x: i,
                y: values[i],
                r: Math.abs(values[i]) / 2 + 4
              })),
              backgroundColor: 'rgba(180, 0, 255, 0.6)',
              borderColor: '#b400ff',
              borderWidth: 1
            }];
            break;

          case 'boxplot':
            // 箱ひげ図：単一ボックス（複数値を括り出した簡易版）
            datasets = [{
              label: 'ボックス',
              data: [values],
              backgroundColor: 'rgba(0, 240, 255, 0.2)',
              borderColor: '#00f0ff',
              borderWidth: 2
            }];
            break;

          case 'heatmap':
            datasets = [{
              label: 'ヒートマップ',
              data: labels.map((label, i) => ({ x: i, y: label, v: values[i] })),
              backgroundColor: (ctx) => {
                const v = ctx.raw ? ctx.raw.v : 0;
                const max = Math.max(...values, 1);
                const alpha = Math.abs(v) / max;
                return `rgba(255, 0, 160, ${alpha})`;
              },
              borderWidth: 1,
              borderColor: '#0a0e17'
            }];
            options.scales = {
              x: { type: 'category', labels: labels, ticks: { color: '#8fa3c8' } },
              y: { type: 'category', labels: labels, ticks: { color: '#8fa3c8' } }
            };
            break;

          case 'sankey':
            const from = labels.slice(0, -1);
            const to = labels.slice(1);
            const flow = values.slice(0, -1);
            datasets = [{
              label: 'フロー',
              data: from.map((f, i) => ({ from: f, to: to[i], flow: Math.abs(flow[i]) })),
              colorFrom: (ctx) => neonColors[ctx.dataIndex % neonColors.length],
              colorTo: (ctx) => neonColors[(ctx.dataIndex + 1) % neonColors.length],
              backgroundColor: (ctx) => neonColors[ctx.dataIndex % neonColors.length] + '44',
              borderWidth: 2
            }];
            break;

          default:
            datasets = [{
              label: 'データ',
              data: values,
              backgroundColor: colors
            }];
        }

        myChart = new Chart(ctx, {
          type: (type === 'horizontalBar') ? 'bar' : (type === 'boxplot' ? 'boxplot' : type),
          data: {
            labels: labels,
            datasets: datasets
          },
          options: options
        });
      }

      // ==== PNGダウンロード ====
      downloadBtn.addEventListener('click', function() {
        const title = chartTitleInput.value || 'グラフ';
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.download = title + '.png';
        a.href = url;
        a.click();
      });

      // ==== グラフタイプ変更時、ヒストグラム選択時はモード切替 ====
      chartTypeSelect.addEventListener('change', function() {
        if (this.value === 'histogram' && !modeHist.checked) {
          switchMode('histogram');
        }
        updateChart();
      });

      // ==== 初期化 ====
      function init() {
        switchMode('normal');
        updateChart();
      }

      init();
    })();
  </script>
</body>
</html>
