<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グラフ作成サイト</title>
  <!-- ファビコン設定 -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <!-- 追加プラグイン CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-boxplot@2.1.0/dist/chartjs-chart-boxplot.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.1.0/dist/chartjs-chart-matrix.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@0.3.0/dist/chartjs-chart-sankey.min.js"></script>
  
  <style>
    /* ===== ネオン輝くダークモードCSS ===== */
    .graph-generator-wrap {
      --neon-blue: #00d9ff;
      --neon-pink: #ff00a2;
      --neon-green: #00ff88;
      --neon-purple: #b200ff;
      --bg-dark: #0a0a0f;
      --panel-dark: #16161d;
      --border-glow: rgba(0, 217, 255, 0.3);
    }

    .graph-generator-wrap {
      background: var(--bg-dark);
      border: 1px solid var(--neon-blue);
      border-radius: 16px;
      padding: 20px;
      margin: 20px 0;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      box-shadow: 0 0 20px var(--border-glow), inset 0 0 20px rgba(0, 217, 255, 0.05);
    }

    .graph-generator-wrap h2 {
      color: var(--neon-blue);
      text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    .graph-generator-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
      align-items: center;
    }

    .graph-generator-controls label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.9rem;
      color: #aaa;
    }

    .graph-generator-controls input,
    .graph-generator-controls select {
      background: var(--panel-dark);
      border: 1px solid #333;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .graph-generator-controls input:focus,
    .graph-generator-controls select:focus {
      outline: none;
      border-color: var(--neon-blue);
      box-shadow: 0 0 8px var(--border-glow);
    }

    .graph-generator-datalist {
      background: var(--panel-dark);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
    }

    .graph-generator-datalist .data-row {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .graph-generator-datalist .data-row input {
      background: #0f0f15;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      flex: 1;
    }

    .graph-generator-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .graph-generator-actions button {
      background: transparent;
      border: 1px solid var(--neon-blue);
      color: var(--neon-blue);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      text-shadow: 0 0 5px rgba(0, 217, 255, 0.5);
    }

    .graph-generator-actions button:hover {
      background: rgba(0, 217, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
    }

    .graph-generator-actions button.download {
      border-color: var(--neon-green);
      color: var(--neon-green);
      text-shadow: 0 0 5px rgba(0, 255, 136, 0.5);
    }

    .graph-generator-actions button.download:hover {
      background: rgba(0, 255, 136, 0.1);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
    }

    .graph-generator-canvas-container {
      background: var(--panel-dark);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      min-height: 400px;
    }

    .graph-generator-canvas-container canvas {
      max-width: 100%px;
      max-height: 500px;
      margin: 0 auto;
    }

    /* レスポンシブ */
    @media (max-width: 768px) {
      .graph-generator-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .graph-generator-actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <!-- ここに他のAIサイトのコンテンツが入る想定 -->

  <!-- ===== グラフ生成ツールセクション ===== -->
  <section id="graph-generator" class="graph-generator-wrap">
    <h2>📊 グラフジェネレーター</h2>
    
    <!-- コントロール群 -->
    <div class="graph-generator-controls">
      <label>グラフタイトル
        <input type="text" id="graphTitle" value="サンプルグラフ" placeholder="グラフタイトルを入力">
      </label>
      <label>グラフタイプ
        <select id="chartType">
          <option value="bar" selected>棒グラフ</option>
          <option value="line">折れ線グラフ</option>
          <option value="pie">円グラフ</option>
          <option value="horizontalBar">帯グラフ（横向き積み上げ）</option>
          <option value="histogram">ヒストグラム</option>
          <option value="scatter">散布図</option>
          <option value="stackedBar">積み上げ棒グラフ</option>
          <option value="radar">レーダーチャート</option>
          <option value="bubble">バブルチャート</option>
          <option value="boxplot">箱ひげ図</option>
          <option value="heatmap">ヒートマップ</option>
          <option value="sankey">サンキーダイアグラム</option>
        </select>
      </label>
    </div>

    <!-- データ入力テーブル -->
    <div class="graph-generator-datalist" id="dataListContainer">
      <div class="data-row" data-label-input>
        <input type="text" class="label-input" placeholder="項目名" value="A">
        <input type="number" class="data-input" placeholder="数値" value="10">
        <button class="delete-row" onclick="removeDataRow(this)" style="background:transparent;border:1px solid var(--neon-pink);color:var(--neon-pink);border-radius:4px;cursor:pointer;padding:0 8px;">✕</button>
      </div>
      <div class="data-row">
        <input type="text" class="label-input" placeholder="項目名" value="B">
        <input type="number" class="data-input" placeholder="数値" value="20">
        <button class="delete-row" onclick="removeDataRow(this)" style="background:transparent;border:1px solid var(--neon-pink);color:var(--neon-pink);border-radius:4px;cursor:pointer;padding:0 8px;">✕</button>
      </div>
      <div class="data-row">
        <input type="text" class="label-input" placeholder="項目名" value="C">
        <input type="number" class="data-input" placeholder="数値" value="15">
        <button class="delete-row" onclick="removeDataRow(this)" style="background:transparent;border:1px solid var(--neon-pink);color:var(--neon-pink);border-radius:4px;cursor:pointer;padding:0 8px;">✕</button>
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="graph-generator-actions">
      <button onclick="addDataRow()">+ データ追加</button>
      <button onclick="updateChart()">更新</button>
      <button class="download" onclick="downloadPNG()">⬇ PNGダウンロード</button>
    </div>

    <!-- グラフ表示エリア -->
    <div class="graph-generator-canvas-container">
      <canvas id="myChart"></canvas>
    </div>
  </section>

  <!-- ===== グラフ描画ロジック ===== -->
  <script>
    // グローバル変数
    let chartInstance = null;
    const ctx = document.getElementById('myChart').getContext('2d');

    // ネオンカラーパレット
    const neonColors = {
      blue: 'rgba(0, 217, 255, 0.8)',
      pink: 'rgba(255, 0, 162, 0.8)',
      green: 'rgba(0, 255, 136, 0.8)',
      purple: 'rgba(178, 0, 255, 0.8)',
      yellow: 'rgba(255, 255, 0, 0.7)',
      orange: 'rgba(255, 165, 0, 0.8)',
    };
    const borderColors = [
      '#00d9ff', '#ff00a2', '#00ff88', '#b200ff', '#ffff00', '#ffa500', '#00ffff', '#ff1493', '#7fff00', '#ff4500', '#00bfff', '#ff00ff'
    ];

    // データ行の追加/削除
    function addDataRow() {
      const container = document.getElementById('dataListContainer');
      const row = document.createElement('div');
      row.className = 'data-row';
      row.innerHTML = `
        <input type="text" class="label-input" placeholder="項目名" value="新項目">
        <input type="number" class="data-input" placeholder="数値" value="10">
        <button class="delete-row" onclick="removeDataRow(this)" style="background:transparent;border:1px solid var(--neon-pink);color:var(--neon-pink);border-radius:4px;cursor:pointer;padding:0 8px;">✕</button>
      `;
      container.appendChild(row);
    }

    function removeDataRow(btn) {
      const row = btn.closest('.data-row');
      const container = document.getElementById('dataListContainer');
      if (container.children.length > 1) {
        row.remove();
      } else {
        // 最低1行は保持
        alert('少なくとも1行は必要です');
      }
    }

    // データ取得
    function getData() {
      const labels = [];
      const values = [];
      const rows = document.querySelectorAll('#dataListContainer .data-row');
      rows.forEach(row => {
        const label = row.querySelector('.label-input').value.trim() || '未設定';
        const val = parseFloat(row.querySelector('.data-input').value) || 0;
        labels.push(label);
        values.push(val);
      });
      return { labels, values };
    }

    // グラフ更新関数
    function updateChart() {
      const title = document.getElementById('graphTitle').value || '無題のグラフ';
      const chartType = document.getElementById('chartType').value;
      const { labels, values } = getData();

      // 既存チャート破棄
      if (chartInstance) {
        chartInstance.destroy();
      }

      // 基本の設定
      const baseConfig = {
        type: chartType,
        data: {
          labels: labels,
          datasets: [{
            label: 'データ',
            data: values,
            backgroundColor: [
              neonColors.blue, neonColors.pink, neonColors.green, neonColors.purple, neonColors.yellow, neonColors.orange,
              'rgba(0, 217, 255, 0.6)', 'rgba(255, 0, 162, 0.6)', 'rgba(0, 255, 136, 0.6)', 'rgba(178, 0, 255, 0.6)', 'rgba(255, 255, 0, 0.6)', 'rgba(255, 165, 0, 0.6)'
            ],
            borderColor: borderColors,
            borderWidth: 2,
            pointBackgroundColor: borderColors,
            pointBorderColor: '#0a0a0f',
            pointHoverBackgroundColor: '#fff',
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            title: {
              display: true,
              text: title,
              color: '#00d9ff',
              font: { size: 20, weight: 'bold' },
              padding: { top: 10, bottom: 10 }
            },
            legend: {
              labels: { color: '#ccc' }
            },
            tooltip: {
              backgroundColor: 'rgba(0,0,0,0.8)',
              titleColor: '#00d9ff',
              bodyColor: '#fff'
            }
          },
          scales: {
            x: {
              ticks: { color: '#ccc' },
              grid: { color: 'rgba(255,255,255,0.05)' }
            },
            y: {
              beginAtZero: true,
              ticks: { color: '#ccc' },
              grid: { color: 'rgba(255,255,255,0.05)' }
            }
          }
        }
      };

      // タイプ別カスタマイズ
      switch (chartType) {
        case 'horizontalBar': {
          baseConfig.options.indexAxis = 'y';
          break;
        }
        case 'histogram': {
          baseConfig.type = 'bar';
          baseConfig.data.datasets[0].barPercentage = 1.0;
          baseConfig.data.datasets[0].categoryPercentage = 1.0;
          break;
        }
        case 'stackedBar': {
          baseConfig.type = 'bar';
          baseConfig.options.scales.x.stacked = true;
          baseConfig.options.scales.y.stacked = true;
          // 複数データセットの例
          baseConfig.data.datasets = [
            {
              label: '系列1',
              data: values,
              backgroundColor: neonColors.blue,
              borderColor: '#00d9ff',
              borderWidth: 1
            },
            {
              label: '系列2',
              data: values.map(v => v * 0.5),
              backgroundColor: neonColors.pink,
              borderColor: '#ff00a2',
              borderWidth: 1
            }
          ];
          break;
        }
        case 'bubble': {
          baseConfig.type = 'bubble';
          baseConfig.data.datasets[0].data = values.map((val, i) => ({
            x: i,
            y: val,
            r: Math.abs(val) * 2
          }));
          break;
        }
        case 'scatter': {
          baseConfig.type = 'scatter';
          baseConfig.data.datasets[0].data = values.map((val, i) => ({ x: i+1, y: val }));
          break;
        }
        case 'boxplot': {
          baseConfig.type = 'boxplot';
          // 箱ひげ図用データ形式: [min, Q1, median, Q3, max]
          const sorted = [...values].sort((a,b) => a-b);
          const q1 = sorted[Math.floor(sorted.length*0.25)] || 0;
          const median = sorted[Math.floor(sorted.length*0.5)] || 0;
          const q3 = sorted[Math.floor(sorted.length*0.75)] || 0;
          baseConfig.data.datasets[0].data = [[Math.min(...values), q1, median, q3, Math.max(...values)]];
          break;
        }
        case 'heatmap': {
          baseConfig.type = 'matrix';
          const matrixData = [];
          for (let i=0; i<labels.length; i++) {
            for (let j=0; j<labels.length; j++) {
              matrixData.push({
                x: j,
                y: i,
                v: values[(i+j)%values.length]
              });
            }
          }
          baseConfig.data.datasets[0].data = matrixData;
          baseConfig.data.datasets[0].backgroundColor = (ctx) => {
            const v = ctx.dataset.data[ctx.dataIndex].v;
            const max = Math.max(...values);
            const min = Math.min(...values);
            const ratio = (v - min) / (max - min || 1);
            return `rgba(0, 217, 255, ${0.3 + ratio * 0.7})`;
          };
          baseConfig.data.datasets[0].borderColor = '#0a0a0f';
          baseConfig.data.datasets[0].borderWidth = 1;
          break;
        }
        case 'sankey': {
          baseConfig.type = 'sankey';
          // サンキーダイアグラム用データ生成
          const nodes = labels;
          const edges = [];
          for (let i=0; i<labels.length-1; i++) {
            edges.push({
              from: labels[i],
              to: labels[i+1],
              flow: Math.abs(values[i])
            });
          }
          baseConfig.data.datasets[0].data = {
            nodes: nodes,
            edges: edges
          };
          break;
        }
      }

      // グラフ生成
      chartInstance = new Chart(ctx, baseConfig);
    }

    // ダウンロード機能
    function downloadPNG() {
      if (!chartInstance) {
        alert('グラフがありません');
        return;
      }
      const title = document.getElementById('graphTitle').value || 'グラフタイトル';
      const link = document.createElement('a');
      link.download = title + '.png';
      link.href = document.getElementById('myChart').toDataURL('image/png');
      link.click();
    }

    // リアルタイム更新（タイトル入力）
    document.getElementById('graphTitle').addEventListener('input', function() {
      if (chartInstance) {
        chartInstance.options.plugins.title.text = this.value || '';
        chartInstance.update();
      }
    });

    // 初期化
    window.addEventListener('DOMContentLoaded', updateChart);
  </script>

  <!-- 他のAIサイトのコンテンツが続く想定 -->
</body>
</html>
