<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グラフ作成サイト</title>
    <!-- 絵文字ファビコン 📊 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">
    <!-- フォント -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- グラフライブラリCDN一括読み込み（順番厳守） -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-box-and-violin@3.2.0/dist/chartjs-chart-box-and-violin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.0/dist/chartjs-chart-matrix.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@0.12.1/dist/chartjs-chart-sankey.min.js"></script>
    <!-- スクリーンショット用 html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <!-- =============== 1. HTML部分 =============== -->
    <section id="graph-generator" class="graph-gen-section">
        <div class="graph-gen-title-area">
            <h1 class="graph-gen-site-title">📊 グラフ作成サイト</h1>
            <span class="graph-gen-badge">AI Tools</span>
        </div>

        <!-- メインコンテナ -->
        <div class="graph-gen-container">
            <!-- コントロールパネル（左） -->
            <div class="graph-gen-controls">
                <!-- グラフタイトル入力（任意） -->
                <div class="graph-gen-card">
                    <label class="graph-gen-label">グラフタイトル（任意）</label>
                    <input type="text" id="graphTitleInput" class="graph-gen-input" placeholder="例: 月間売上データ" value="">
                </div>

                <!-- 種類選択 -->
                <div class="graph-gen-card">
                    <label class="graph-gen-label">グラフ種類</label>
                    <select id="graphTypeSelect" class="graph-gen-select">
                        <option value="bar">棒グラフ</option>
                        <option value="line">折れ線グラフ</option>
                        <option value="pie">円グラフ</option>
                        <option value="doughnut">帯グラフ</option>
                        <option value="histogram">ヒストグラム</option>
                        <option value="scatter">散布図</option>
                        <option value="stackedBar">積み上げ棒グラフ</option>
                        <option value="radar">レーダーチャート</option>
                        <option value="bubble">バブルチャート</option>
                        <option value="boxplot">箱ひげ図</option>
                        <option value="heatmap">ヒートマップ</option>
                        <option value="sankey">サンキーダイアグラム</option>
                    </select>
                </div>

                <!-- データ入力エリア -->
                <div class="graph-gen-card graph-gen-data-card">
                    <label class="graph-gen-label">データ入力 (初期状態は空です)</label>
                    <div id="dataRowsContainer" class="graph-gen-rows"></div>
                    <button id="addDataRowBtn" class="graph-gen-add-btn">+ データ行を追加</button>
                </div>

                <!-- スクリーンショット保存ボタン -->
                <div class="graph-gen-card graph-gen-download-card">
                    <button id="screenshotBtn" class="graph-gen-download-btn">📸 スクリーンショット保存</button>
                </div>
            </div>

            <!-- チャート表示エリア（右） -->
            <div class="graph-gen-chart-area">
                <div id="chartCard" class="graph-gen-chart-wrap">
                    <canvas id="graphCanvas"></canvas>
                </div>
            </div>
        </div>
    </section>

    <!-- =============== 2. CSS部分 =============== -->
    <style>
        /* ネオンカラー変数 */
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff007a;
            --neon-green: #39ff14;
            --neon-yellow: #fff700;
            --bg-dark: #0a0a12;
            --card-bg: #14141f;
            --text-color: #e0e0ff;
            --border-neon: rgba(0, 243, 255, 0.5);
        }

        /* 全体をダークネオン基調に */
        .graph-gen-section {
            background: var(--bg-dark);
            padding: 20px;
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        .graph-gen-section * {
            box-sizing: border-box;
        }

        /* タイトル */
        .graph-gen-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .graph-gen-site-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue), 0 0 30px var(--neon-blue), 0 0 50px var(--neon-blue);
            letter-spacing: 2px;
        }
        .graph-gen-badge {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-yellow));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
            font-size: 1.2rem;
            border: 1px solid var(--neon-pink);
            padding: 4px 12px;
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(255, 0, 122, 0.5);
            animation: neonPulse 1.5s infinite alternate;
        }

        /* メインコンテナ：レスポンシブFlex */
        .graph-gen-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* コントロールパネル（左側） */
        .graph-gen-controls {
            flex: 0 0 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* チャートエリア（右側） */
        .graph-gen-chart-area {
            flex: 1 1 500px;
            min-width: 300px;
        }

        /* カード型UI */
        .graph-gen-card {
            background: var(--card-bg);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
            backdrop-filter: blur(5px);
        }
        .graph-gen-label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--neon-green);
            text-shadow: 0 0 5px var(--neon-green);
            letter-spacing: 0.5px;
        }
        .graph-gen-input,
        .graph-gen-select {
            width: 100%;
            background: #0d0d1a;
            border: 1px solid #2a2a4a;
            color: var(--text-color);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }
        .graph-gen-input:focus,
        .graph-gen-select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
        }

        /* データ行 */
        .graph-gen-rows {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
        .graph-gen-data-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .graph-gen-data-row input {
            flex: 1;
            padding: 8px;
            background: #0d0d1a;
            border: 1px solid #2a2a4a;
            color: var(--text-color);
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .graph-gen-data-row input:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 8px var(--neon-pink);
        }
        .graph-gen-del-btn {
            background: transparent;
            border: 1px solid #ff5555;
            color: #ff5555;
            border-radius: 6px;
            cursor: pointer;
            padding: 8px 12px;
            transition: all 0.2s;
        }
        .graph-gen-del-btn:hover {
            background: rgba(255, 85, 85, 0.2);
            box-shadow: 0 0 10px rgba(255, 85, 85, 0.5);
        }

        /* 追加ボタン */
        .graph-gen-add-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-yellow));
            border: none;
            color: #000;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 0 10px rgba(255, 0, 122, 0.5);
        }
        .graph-gen-add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(255, 0, 122, 0.8);
        }

        /* スクリーンショットボタン */
        .graph-gen-download-card {
            text-align: center;
        }
        .graph-gen-download-btn {
            padding: 12px 20px;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-green));
            border: none;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .graph-gen-download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
        }

        /* チャート表示エリア */
        .graph-gen-chart-wrap {
            background: var(--card-bg);
            border: 1px solid var(--border-neon);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.1);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
        }
        #graphCanvas {
            width: 100% !important;
            height: 550px !important; /* レスポンシブ高さ調整 */
            max-height: 80vh;
        }

        /* スマホ対応（ブレイクポイント） */
        @media (max-width: 768px) {
            .graph-gen-container {
                flex-direction: column;
            }
            .graph-gen-controls {
                flex: 0 0 100%;
            }
            .graph-gen-chart-area {
                flex: 0 0 100%;
            }
            #graphCanvas {
                height: 400px !important;
            }
            .graph-gen-site-title {
                font-size: 1.5rem;
            }
        }

        @keyframes neonPulse {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }
    </style>

    <!-- =============== 3. JavaScript部分 =============== -->
    <script>
        (function() {
            const dataRowsContainer = document.getElementById('dataRowsContainer');
            const addDataRowBtn = document.getElementById('addDataRowBtn');
            const graphTitleInput = document.getElementById('graphTitleInput');
            const graphTypeSelect = document.getElementById('graphTypeSelect');
            const canvas = document.getElementById('graphCanvas');
            const chartCard = document.getElementById('chartCard');
            let chartInstance = null;

            // ネオンカラーパレット
            const neonColors = ['#00f3ff', '#ff007a', '#39ff14', '#fff700', '#ff6b6b', '#a29bfe', '#fd79a8', '#55efc4', '#ff9f43', '#6c5ce7', '#00cec9', '#e17055'];
            const colorCount = neonColors.length;

            // --- データ行追加関数 ---
            function addDataRow(label = '', value = '', extra = '') {
                const row = document.createElement('div');
                row.className = 'graph-gen-data-row';
                row.innerHTML = `
                    <input type="text" class="data-label" placeholder="ラベル（X軸）" value="${label}">
                    <input type="text" class="data-value" placeholder="値（Y軸）" value="${value}">
                    <input type="text" class="data-extra" placeholder="追加" value="${extra}">
                    <button type="button" class="graph-gen-del-btn">🗑️</button>
                `;
                row.querySelector('.graph-gen-del-btn').addEventListener('click', function() {
                    row.remove();
                    updateChart();
                });
                row.querySelectorAll('input').forEach(input => {
                    input.addEventListener('input', updateChart);
                });
                dataRowsContainer.appendChild(row);
            }

            // --- データ収集関数 ---
            function collectData() {
                const rows = dataRowsContainer.querySelectorAll('.graph-gen-data-row');
                const labels = [];
                const values = [];
                const extras = [];
                rows.forEach(row => {
                    const label = row.querySelector('.data-label').value.trim();
                    const value = row.querySelector('.data-value').value.trim();
                    const extra = row.querySelector('.data-extra').value.trim();
                    if (label !== '' && value !== '') {
                        labels.push(label);
                        values.push(value);
                        extras.push(extra);
                    }
                });
                return { labels, values, extras };
            }

            // --- グラフ更新関数 ---
            function updateChart() {
                const type = graphTypeSelect.value;
                const title = graphTitleInput.value.trim();
                const { labels, values, extras } = collectData();

                if (chartInstance) {
                    chartInstance.destroy();
                }

                const ctx = canvas.getContext('2d');
                let data = { labels: [], datasets: [] };
                let chartType = 'bar';

                const len = labels.length;
                const singleColor = (i) => ({
                    borderColor: neonColors[i % colorCount],
                    backgroundColor: neonColors[i % colorCount] + '99',
                    borderWidth: 2,
                    pointHoverRadius: 8,
                    pointHoverBackgroundColor: neonColors[(i+3) % colorCount],
                    shadowColor: neonColors[i % colorCount],
                    shadowBlur: 20,
                });

                switch (type) {
                    case 'bar':
                        chartType = 'bar';
                        data = {
                            labels: labels,
                            datasets: [{
                                label: '値',
                                data: values.map(v => parseFloat(v) || 0),
                                backgroundColor: neonColors.map(c => c + '99'),
                                borderColor: neonColors,
                                borderWidth: 2,
                                hoverBackgroundColor: neonColors.map(c => c + 'CC'),
                            }]
                        };
                        break;
                    case 'line':
                        chartType = 'line';
                        data = {
                            labels: labels,
                            datasets: [{
                                label: '値',
                                data: values.map(v => parseFloat(v) || 0),
                                borderColor: neonColors[0],
                                backgroundColor: neonColors[0] + '22',
                                pointBackgroundColor: neonColors.map((_, i) => neonColors[i % colorCount]),
                                pointBorderColor: '#fff',
                                tension: 0.4,
                                fill: true,
                                ...singleColor(0)
                            }]
                        };
                        break;
                    case 'pie':
                        chartType = 'pie';
                        data = {
                            labels: labels,
                            datasets: [{
                                data: values.map(v => parseFloat(v) || 0),
                                backgroundColor: neonColors.map(c => c + 'BB'),
                                borderColor: '#0a0a12',
                                borderWidth: 3,
                                hoverOffset: 20,
                            }]
                        };
                        break;
                    case 'doughnut':
                        chartType = 'doughnut';
                        data = {
                            labels: labels,
                            datasets: [{
                                data: values.map(v => parseFloat(v) || 0),
                                backgroundColor: neonColors.map(c => c + 'AA'),
                                borderColor: '#0a0a12',
                                borderWidth: 3,
                                hoverOffset: 20,
                            }]
                        };
                        break;
                    case 'histogram':
                        chartType = 'bar';
                        data = {
                            labels: labels,
                            datasets: [{
                                label: '頻度',
                                data: values.map(v => parseFloat(v) || 0),
                                backgroundColor: neonColors[2] + '88',
                                borderColor: neonColors[2],
                                borderWidth: 2,
                                barThickness: 'flex',
                            }]
                        };
                        break;
                    case 'scatter':
                        chartType = 'scatter';
                        data = {
                            datasets: [{
                                label: '散布データ',
                                data: labels.map((lab, i) => ({
                                    x: parseFloat(lab) || i,
                                    y: parseFloat(values[i]) || 0
                                })),
                                backgroundColor: neonColors[0] + 'AA',
                                borderColor: neonColors[0],
                                pointRadius: 6,
                                pointHoverRadius: 10,
                                borderWidth: 1,
                            }]
                        };
                        break;
                    case 'stackedBar':
                        chartType = 'bar';
                        data = {
                            labels: labels,
                            datasets: [{
                                label: '値',
                                data: values.map(v => parseFloat(v) || 0),
                                backgroundColor: neonColors[1] + '66',
                                borderColor: neonColors[1],
                                borderWidth: 2,
                                stack: 'stack1',
                            }]
                        };
                        break;
                    case 'radar':
                        chartType = 'radar';
                        data = {
                            labels: labels,
                            datasets: [{
                                label: '値',
                                data: values.map(v => parseFloat(v) || 0),
                                backgroundColor: neonColors[3] + '44',
                                borderColor: neonColors[3],
                                pointBackgroundColor: neonColors[3],
                                borderWidth: 3,
                            }]
                        };
                        break;
                    case 'bubble':
                        chartType = 'bubble';
                        data = {
                            datasets: [{
                                label: 'バブル',
                                data: labels.map((lab, i) => ({
                                    x: parseFloat(lab) || i,
                                    y: parseFloat(values[i]) || 0,
                                    r: parseFloat(extras[i]) || 8,
                                })),
                                backgroundColor: neonColors[4] + '88',
                                borderColor: neonColors[4],
                                borderWidth: 2,
                                hoverRadius: 20,
                            }]
                        };
                        break;
                    case 'boxplot':
                        chartType = 'boxplot';
                        const boxData = values.map(val => {
                            const arr = val.split(',').map(Number).filter(n => !isNaN(n));
                            return arr.length > 0 ? arr : [0];
                        });
                        data = {
                            labels: labels,
                            datasets: [{
                                label: '箱ひげ',
                                data: boxData,
                                backgroundColor: neonColors[5] + '77',
                                borderColor: neonColors[5],
                                borderWidth: 2,
                                outlierColor: neonColors[1],
                                itemStyle: 'circle',
                                outlierRadius: 4,
                            }]
                        };
                        break;
                    case 'heatmap':
                        chartType = 'matrix';
                        const heatData = [];
                        labels.forEach((lab, i) => {
                            const y = parseFloat(values[i]) || i;
                            const v = parseFloat(extras[i]) || 1;
                            heatData.push({ x: lab, y: y, v: v });
                        });
                        data = {
                            labels: labels,
                            datasets: [{
                                label: 'ヒートマップ',
                                data: heatData,
                                backgroundColor: (ctx) => {
                                    const raw = ctx.raw.v;
                                    if (raw > 0.5) return 'rgba(255, 0, 122, 0.8)';
                                    if (raw > 0.2) return 'rgba(0, 243, 255, 0.7)';
                                    return 'rgba(57, 255, 20, 0.5)';
                                },
                                borderColor: '#0a0a12',
                                borderWidth: 1,
                                borderRadius: 2,
                            }]
                        };
                        break;
                    case 'sankey':
                        chartType = 'sankey';
                        const flowData = [];
                        labels.forEach((lab, i) => {
                            const from = lab;
                            const to = values[i];
                            const flow = parseFloat(extras[i]) || 1;
                            if (from && to) {
                                flowData.push({ from, to, flow });
                            }
                        });
                        data = {
                            labels: labels,
                            datasets: [{
                                label: 'サンキー',
                                data: flowData,
                                alternateColor: false,
                                color: (ctx) => {
                                    const colors = ['#00f3ff', '#ff007a', '#39ff14', '#fff700'];
                                    return colors[ctx.dataIndex % colors.length];
                                }
                            }]
                        };
                        break;
                    default:
                        return;
                }

                const options = {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 400, easing: 'easeOutQuart' },
                    plugins: {
                        title: {
                            display: title !== '', // タイトルが空なら非表示
                            text: title,
                            color: '#00f3ff',
                            font: { size: 20, family: "'Orbitron', sans-serif", weight: 'bold' },
                            padding: 15,
                        },
                        legend: {
                            labels: { color: '#e0e0ff', boxWidth: 20, font: { family: "'Rajdhani', sans-serif" } }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(10,10,18,0.9)',
                            borderColor: '#00f3ff',
                            borderWidth: 1,
                            titleColor: '#00f3ff',
                            bodyColor: '#fff',
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.1)', borderColor: 'rgba(0, 243, 255, 0.5)' },
                            ticks: { color: '#a0a0ff' },
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.1)', borderColor: 'rgba(255, 0, 122, 0.5)' },
                            ticks: { color: '#a0a0ff' },
                        }
                    }
                };

                if (type === 'doughnut' || type === 'pie') {
                    delete options.scales;
                }

                try {
                    if (type === 'boxplot' && typeof ChartBoxPlot !== 'undefined') Chart.register(ChartBoxPlot);
                    if (type === 'heatmap' && typeof MatrixController !== 'undefined') Chart.register(MatrixController, MatrixElement);
                    if (type === 'sankey' && typeof SankeyController !== 'undefined') Chart.register(SankeyController, SankeyElement);
                } catch(e) { console.warn('プラグイン登録エラー:', e); }

                chartInstance = new Chart(ctx, {
                    type: chartType,
                    data: data,
                    options: options
                });
            }

            // --- スクリーンショット保存ボタン ---
            document.getElementById('screenshotBtn').addEventListener('click', function() {
                if (!chartInstance) {
                    alert('先にグラフを生成してください');
                    return;
                }
                const title = graphTitleInput.value.trim() || 'グラフ作成サイト';
                html2canvas(chartCard).then(canvasPng => {
                    const link = document.createElement('a');
                    link.download = title.replace(/[\\/:*?"<>|]/g, '_') + '.png';
                    link.href = canvasPng.toDataURL('image/png');
                    link.click();
                });
            });

            // --- イベントリスナー ---
            addDataRowBtn.addEventListener('click', function() {
                addDataRow();
                updateChart();
            });
            graphTitleInput.addEventListener('input', updateChart);
            graphTypeSelect.addEventListener('change', updateChart);

            // --- 初期化: 空行を1つ追加し、グラフを描画 ---
            addDataRow('', '', '');
            updateChart();
        })();
    </script>
</body>
</html>
