<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グラフ作成サイト</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>📊</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #e0e0e0;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      background: #12122a;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
      padding: 30px;
      border: 1px solid #00ffff33;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 2rem;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      margin-bottom: 10px;
    }

    h1 span { font-size: 2.4rem; filter: drop-shadow(0 0 10px #ff00ff); }

    .subtitle { color: #ff00ff; margin-bottom: 24px; }

    /* チャートエリア */
    .chart-area {
      background: rgba(0, 0, 30, 0.8);
      border: 1px solid #00ffff80;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 30px;
      height: 350px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
      position: relative;
    }

    .chart-title-display {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffff00;
      text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00;
      z-index: 10;
      max-width: 80%;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      padding: 5px 15px;
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      border: 1px solid #ffff0066;
      pointer-events: none; /* クリックは透過 */
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* コントロール */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
      margin-bottom: 30px;
      background: #1a1a30;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #ff00ff40;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 150px;
    }

    .control-group label {
      font-size: 0.9rem;
      color: #00ffff;
      margin-bottom: 4px;
      font-weight: 600;
      text-shadow: 0 0 5px #00ffff;
    }

    .control-group input,
    .control-group select {
      background: #000020;
      border: 1px solid #00ffff;
      color: white;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
    }

    .control-group input[type="text"] {
      flex: 2; 
    }

    button {
      background: linear-gradient(135deg, #00ffff, #ff00ff);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px #00ffff80;
      transition: 0.3s;
      margin-top: auto;
    }

    button:hover {
      box-shadow: 0 0 25px #ff00ff;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid #00ffff;
      color: #00ffff;
      box-shadow: none;
    }
    .btn-secondary:hover { background: #00ffff20; }

    .btn-danger {
      background: transparent;
      border: 1px solid #ff00ff;
      color: #ff00ff;
      box-shadow: none;
    }
    .btn-danger:hover { background: #ff00ff20; }

    /* データ入力エリア */
    .data-input-section {
      background: #1a1a30;
      border: 1px solid #00ffff40;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .data-input-section h3 {
      color: #ff00ff;
      margin-bottom: 16px;
      text-shadow: 0 0 5px #ff00ff;
    }

    .data-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 20px;
      max-width: 600px;
    }

    .data-row label {
      color: #00ffff;
      text-shadow: 0 0 3px #00ffff;
      font-size: 0.9rem;
    }

    .data-row input {
      background: #000020;
      border: 1px solid #00ffff60;
      color: white;
      padding: 8px;
      border-radius: 6px;
      width: 100%;
    }

    .data-row input:focus {
      border-color: #ff00ff;
      box-shadow: 0 0 8px #ff00ff;
      outline: none;
    }

    .input-actions {
      margin-top: 20px;
    }

    /* 説明セクション */
    .explanation h2 {
      color: #ffff00;
      text-shadow: 0 0 5px #ffff00;
    }

    .card {
      background: #1a1a30;
      border: 1px solid #00ffff30;
      margin-top: 10px;
      padding: 15px;
      border-radius: 8px;
    }

    .card h3 { color: #00ffff; }
    .card p { color: #ccc; }

    .howto {
      background: #220022;
      border: 1px solid #ff00ff;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .howto h3 { color: #ffff00; }
    .howto ol { color: #ccc; line-height: 2; }
    .howto code { background: #000; padding: 2px 6px; color: #00ffff; }
  </style>
</head>
<body>
  <div class="container">
    <h1><span>📊</span> グラフ作成</h1>
    <p class="subtitle">データを入力してグラフを描こう</p>

    <div class="chart-area">
      <div id="chartTitleDisplay" class="chart-title-display">グラフ名</div>
      <canvas id="myChart"></canvas>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="graphTitle">グラフ名</label>
        <input type="text" id="graphTitle" placeholder="グラフタイトルを入力" value="グラフ名">
      </div>
      <div class="control-group">
        <label for="dataCount">データ数</label>
        <input type="number" id="dataCount" min="1" max="12" value="3">
      </div>
      <div class="control-group">
        <label for="chartType">種類</label>
        <select id="chartType">
          <option value="bar">棒</option>
          <option value="line">折れ線</option>
          <option value="pie">円</option>
          <option value="doughnut">ドーナツ</option>
        </select>
      </div>
      <div class="btn-group">
        <button id="updateBtn">描画</button>
        <button id="resetBtn" class="btn-danger">全消去</button>
        <button id="undoBtn" class="btn-secondary" disabled>巻き戻し</button>
      </div>
    </div>

    <div class="data-input-section">
      <h3>💾 データ入力</h3>
      <div id="dataInputContainer" class="data-grid"></div>
      <div class="input-actions">
        <button id="clearInputsBtn" class="btn-danger" style="padding:8px 16px;">入力欄クリア</button>
      </div>
    </div>

    <div class="explanation">
      <h2>📖 グラフの種類と使い方</h2>
      <div class="card">
        <h3>📊 棒グラフ</h3>
        <p>カテゴリー比較に最適</p>
      </div>
      <div class="card">
        <h3>📈 折れ線グラフ</h3>
        <p>トレンドや変化を表示</p>
      </div>
      <div class="card">
        <h3>🥧 円グラフ</h3>
        <p>割合を視覚化</p>
      </div>
      <div class="card">
        <h3>🍩 ドーナツグラフ</h3>
        <p>割合表示＋中心情報</p>
      </div>
      <div class="howto">
        <h3>💡 使い方</h3>
        <ol>
          <li>グラフ名を入力（例: 月間売上）</li>
          <li>データ数で項目数設定</li>
          <li>ラベルと値を入力</li>
          <li>「描画」ボタンで表示</li>
          <li>「全消去」でリセット、「巻き戻し」で1ステップ戻る</li>
        </ol>
      </div>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('myChart').getContext('2d');
    let chart;
    let history = [];

    const neonColors = ['#00ffff', '#ff00ff', '#ffff00', '#00ff88', '#ff6600', '#ff3388', '#33ccff', '#ccff00', '#ff0033', '#55ffff', '#ff55ff', '#ffff55'];
    const neonBorder = ['#00ffff', '#ff00ff', '#ffff00', '#00ff88', '#ff6600', '#ff3388', '#33ccff', '#ccff00', '#ff0033', '#55ffff', '#ff55ff', '#ffff55'];

    // グラフ名表示を更新
    function updateTitleDisplay(title) {
      document.getElementById('chartTitleDisplay').textContent = title || 'グラフ名';
    }

    function generateInputs(count, savedLabels = [], savedValues = []) {
      const container = document.getElementById('dataInputContainer');
      container.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const lb = document.createElement('div');
        lb.className = 'data-row';
        const lv = savedLabels[i-1] ?? '';
        lb.innerHTML = `<label for="label_${i}" style="color:${neonColors[(i-1)%neonColors.length]}">ラベル${i}</label>
                        <input type="text" id="label_${i}" value="${lv.replace(/"/g,'&quot;')}" style="border-color:${neonColors[(i-1)%neonColors.length]}">`;
        container.appendChild(lb);

        const vb = document.createElement('div');
        vb.className = 'data-row';
        const vv = savedValues[i-1] !== null && savedValues[i-1] !== undefined ? savedValues[i-1] : '';
        vb.innerHTML = `<label for="value_${i}" style="color:${neonColors[(i-1)%neonColors.length]}">値${i}</label>
                        <input type="number" id="value_${i}" value="${vv}" step="any" style="border-color:${neonColors[(i-1)%neonColors.length]}">`;
        container.appendChild(vb);
      }
    }

    // 状態保存（グラフ名も含める）
    function saveState() {
      const title = document.getElementById('graphTitle').value.trim() || 'グラフ名';
      const count = parseInt(document.getElementById('dataCount').value) || 0;
      const type = document.getElementById('chartType').value;
      const labels = [];
      const values = [];
      for (let i=1; i<=count; i++) {
        const lbl = document.getElementById(`label_${i}`);
        const val = document.getElementById(`value_${i}`);
        if (!lbl || !val) break;
        labels.push(lbl.value.trim());
        const v = val.value === '' ? null : parseFloat(val.value);
        values.push(v);
      }
      return { title, count, type, labels, values };
    }

    function restoreState(state) {
      document.getElementById('graphTitle').value = state.title || 'グラフ名';
      document.getElementById('dataCount').value = state.count;
      document.getElementById('chartType').value = state.type;
      generateInputs(state.count, state.labels, state.values);
      updateTitleDisplay(state.title);
      
      const labels = [], values = [];
      state.labels.forEach((l,i)=>{
        if (state.values[i] !== null) {
          labels.push(l || `項目${i+1}`);
          values.push(state.values[i]);
        }
      });
      createChart(state.type, labels, values, state.title);
      document.getElementById('undoBtn').disabled = history.length === 0;
    }

    function createChart(type, labels, data, title = 'グラフ名') {
      if (chart) chart.destroy();
      const isPie = (type==='pie' || type==='doughnut');
      const bg = data.map((_,i)=>neonColors[i%neonColors.length] + (isPie ? 'CC' : '88'));
      const config = {
        type: type,
        data: {
          labels,
          datasets: [{
            data,
            label: title,
            backgroundColor: bg,
            borderColor: neonBorder,
            borderWidth: 2,
            pointBackgroundColor: neonColors,
            pointBorderColor: '#fff',
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { 
              display: isPie, 
              labels: { color: '#00ffff' },
              title: {
                display: true,
                text: title,
                color: '#ffff00',
                font: { size: 16, weight: 'bold' },
                padding: { bottom: 10 }
              }
            },
            tooltip: { backgroundColor: '#000', titleColor: '#00ffff', borderColor: '#ff00ff' }
          },
          scales: isPie ? {} : {
            x: { ticks: { color: '#00ffff' }, grid: { color: '#00ffff22' } },
            y: { beginAtZero: true, ticks: { color: '#ff00ff' }, grid: { color: '#ff00ff22' } }
          }
        }
      };
      chart = new Chart(ctx, config);
      updateTitleDisplay(title);
    }

    function init() {
      generateInputs(3);
      updateTitleDisplay('グラフ名');
      createChart('bar', [], [], 'グラフ名');
      document.getElementById('undoBtn').disabled = true;
    }

    // イベント
    document.getElementById('dataCount').addEventListener('change', function(){
      let c = parseInt(this.value) || 1;
      if (c<1) c=1;
      if (c>12) c=12;
      this.value = c;
      const old = saveState();
      const newLabels = [], newValues = [];
      for (let i=0;i<c;i++) {
        newLabels.push(old.labels[i] || '');
        newValues.push(old.values[i] !== undefined ? old.values[i] : null);
      }
      generateInputs(c, newLabels, newValues);
    });

    document.getElementById('updateBtn').addEventListener('click', ()=>{
      history.push(saveState());
      if (history.length>5) history.shift();
      const st = saveState();
      const labels = [], values = [];
      st.labels.forEach((l,i)=>{
        if (st.values[i] !== null) {
          labels.push(l || `項目${i+1}`);
          values.push(st.values[i]);
        }
      });
      createChart(st.type, labels, values, st.title);
      document.getElementById('undoBtn').disabled = false;
    });

    document.getElementById('resetBtn').addEventListener('click', ()=>{
      history.push(saveState());
      if (history.length>5) history.shift();
      document.getElementById('graphTitle').value = 'グラフ名';
      document.getElementById('dataCount').value = 3;
      document.getElementById('chartType').value = 'bar';
      generateInputs(3);
      createChart('bar', [], [], 'グラフ名');
      document.getElementById('undoBtn').disabled = false;
    });

    document.getElementById('undoBtn').addEventListener('click', ()=>{
      if (history.length) {
        const prev = history.pop();
        restoreState(prev);
        document.getElementById('undoBtn').disabled = history.length===0;
      }
    });

    document.getElementById('clearInputsBtn').addEventListener('click', ()=>{
      const cnt = parseInt(document.getElementById('dataCount').value) || 3;
      generateInputs(cnt);
    });

    // グラフ名をリアルタイムで表示欄に反映（入力中）
    document.getElementById('graphTitle').addEventListener('input', function(){
      updateTitleDisplay(this.value.trim() || 'グラフ名');
    });

    init();
  </script>
</body>
</html>
