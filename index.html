<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グラフ作成サイト</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            color: #fff;
            background: #000;
            background-image:
                radial-gradient(circle at 70% 10%, rgba(255, 45, 149, 0.15), transparent 60%),
                radial-gradient(circle at 15% 85%, rgba(0, 229, 255, 0.15), transparent 50%),
                radial-gradient(circle at 40% 40%, #0b0b1a, #000);
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 30px;
            border-radius: 16px;
            background: rgba(10, 10, 30, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid #00e5ff;
            box-shadow:
                0 0 30px rgba(0, 229, 255, 0.3),
                inset 0 0 30px rgba(0, 229, 255, 0.05);
        }

        h1 {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 4px;
            margin-bottom: 6px;
            color: #fff;
            text-shadow:
                0 0 8px #ff2d95,
                0 0 20px #ff2d95,
                0 0 40px #ff2d95;
        }

        .subtitle {
            text-align: center;
            color: #00e5ff;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.85rem;
            margin-bottom: 25px;
            text-shadow: 0 0 6px #00e5ff;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            flex: 1;
            min-width: 160px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ff2d95;
            text-shadow: 0 0 6px #ff2d95;
        }

        select,
        input {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff2d95;
            border-radius: 8px;
            outline: none;
            box-shadow: 0 0 6px rgba(255, 45, 149, 0.4);
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
        }

        select option {
            background: #111;
        }

        select:focus,
        input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
        }

        .data-section {
            margin-bottom: 20px;
        }

        .data-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .data-header span {
            color: #39ff14;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
            text-shadow: 0 0 6px #39ff14;
        }

        .data-rows {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }

        .data-row {
            display: flex;
            gap: 10px;
        }

        .data-row input {
            flex: 1;
        }

        .delete-row {
            padding: 0 14px;
            font-size: 1.2rem;
            background: transparent;
            border: 1px solid #ff2d95;
            border-radius: 8px;
            color: #ff2d95;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 45, 149, 0.5);
            transition: all 0.2s;
        }

        .delete-row:hover {
            background: #ff2d95;
            color: #000;
            box-shadow: 0 0 18px #ff2d95;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            padding: 10px 22px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-add {
            background: transparent;
            color: #39ff14;
            border: 1px solid #39ff14;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
        }

        .btn-add:hover {
            background: #39ff14;
            color: #000;
            box-shadow: 0 0 24px #39ff14;
        }

        .btn-generate {
            flex: 1;
            background: #ff2d95;
            color: #000;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(255, 45, 149, 0.7);
        }

        .btn-generate:hover {
            box-shadow:
                0 0 25px #ff2d95,
                0 0 50px #ff2d95;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
            margin-top: 20px;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #b537f2;
            background: rgba(0, 0, 0, 0.35);
            box-shadow:
                inset 0 0 30px rgba(181, 55, 242, 0.15),
                0 0 20px rgba(181, 55, 242, 0.2);
        }

        .empty-message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            font-size: 0.9rem;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px;
            }
            .chart-wrapper {
                height: 300px;
            }
            .data-row {
                flex-wrap: wrap;
            }
            .data-row input {
                flex: 1 1 100%;
            }
            .delete-row {
                flex: 1 1 auto;
                padding: 8px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 GRAPH LAB</h1>
        <p class="subtitle">Neon Chart Generator</p>

        <div class="control-panel">
            <div class="form-group">
                <label for="chart-type">グラフの種類</label>
                <select id="chart-type">
                    <option value="bar">棒グラフ</option>
                    <option value="line">折れ線グラフ</option>
                    <option value="pie">円グラフ</option>
                    <option value="doughnut">ドーナツグラフ</option>
                    <option value="radar">レーダーチャート</option>
                    <option value="area">エリアグラフ</option>
                </select>
            </div>
        </div>

        <div class="data-section">
            <div class="data-header">
                <span>データ入力</span>
                <button class="btn btn-add" id="add-row">＋ 行を追加</button>
            </div>
            <div class="data-rows" id="data-rows">
                <!-- JSで行が追加される -->
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-generate" id="generate">⚡ グラフを生成</button>
        </div>

        <div class="chart-wrapper">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        // ===== 初期データ行 =====
        function addRow(label = '', value = '') {
            const container = document.getElementById('data-rows');
            const row = document.createElement('div');
            row.className = 'data-row';
            row.innerHTML = `
                <input type="text" class="label-input" placeholder="項目名" value="${label}">
                <input type="number" class="value-input" placeholder="数値" value="${value}" step="any">
                <button class="delete-row" type="button" aria-label="行を削除">✕</button>
            `;
            container.appendChild(row);
        }

        // 初期状態は3行
        addRow('売上', '1200');
        addRow('コスト', '800');
        addRow('利益', '400');

        // ===== 行の追加・削除 =====
        document.getElementById('add-row').addEventListener('click', () => {
            addRow();
            attachDeleteEvents();
        });

        function attachDeleteEvents() {
            document.querySelectorAll('.delete-row').forEach(btn => {
                btn.removeEventListener('click', handleDelete);
                btn.addEventListener('click', handleDelete);
            });
        }

        function handleDelete(e) {
            const rows = document.querySelectorAll('#data-rows .data-row');
            if (rows.length > 1) {
                e.target.closest('.data-row').remove();
            } else {
                alert('最低でも1行は必要です');
            }
        }

        attachDeleteEvents();

        // ===== グラフ生成 =====
        let chart = null;

        document.getElementById('generate').addEventListener('click', () => {
            generateChart();
        });

        function generateChart() {
            const type = document.getElementById('chart-type').value;
            const rows = document.querySelectorAll('#data-rows .data-row');
            const labels = [];
            const data = [];

            rows.forEach(row => {
                const label = row.querySelector('.label-input').value.trim();
                const val = row.querySelector('.value-input').value;
                if (label === '') return;
                labels.push(label);
                const num = parseFloat(val);
                data.push(isNaN(num) ? 0 : num);
            });

            if (labels.length === 0) {
                alert('項目名を入力してください');
                return;
            }

            const ctx = document.getElementById('myChart').getContext('2d');
            if (chart) chart.destroy();

            // ネオンカラーパレット
            const neonColors = ['#ff2d95', '#00e5ff', '#39ff14', '#b537f2', '#ffb347', '#ff2d2d', '#00ffcc', '#ff77ff'];

            let chartType = type;
            let chartData;
            let chartOptions;

            // データセットを種類ごとに調整
            if (type === 'pie' || type === 'doughnut') {
                chartData = {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: neonColors.map(c => c + 'cc'),
                        borderColor: neonColors,
                        borderWidth: 2,
                        hoverBorderColor: '#000',
                    }]
                };
                chartOptions = {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#fff', font: { family: 'Rajdhani', size: 14 } }
                        }
                    }
                };
            } else if (type === 'radar') {
                chartData = {
                    labels: labels,
                    datasets: [{
                        label: 'データ',
                        data: data,
                        backgroundColor: 'rgba(0, 229, 255, 0.2)',
                        borderColor: '#00e5ff',
                        borderWidth: 2,
                        pointBackgroundColor: '#ff2d95',
                        pointBorderColor: '#fff',
                        pointRadius: 4,
                        pointHoverRadius: 7,
                    }]
                };
                chartOptions = {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#fff', font: { family: 'Rajdhani', size: 14 } }
                        }
                    },
                    scales: {
                        r: {
                            ticks: {
                                color: '#fff',
                                backdropColor: 'transparent',
                                showLabelBackdrop: false
                            },
                            grid: { color: 'rgba(255,255,255,0.2)' },
                            angleLines: { color: 'rgba(255,255,255,0.2)' },
                            pointLabels: { color: '#fff', font: { size: 13 } }
                        }
                    }
                };
            } else if (type === 'bar') {
                chartData = {
                    labels: labels,
                    datasets: [{
                        label: 'データ',
                        data: data,
                        backgroundColor: neonColors,
                        borderColor: neonColors.map(c => c + 'aa'),
                        borderWidth: 2,
                        borderRadius: 4,
                    }]
                };
                chartOptions = {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#fff' } }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        },
                        y: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        }
                    }
                };
            } else { // line / area
                chartType = 'line';
                chartData = {
                    labels: labels,
                    datasets: [{
                        label: 'データ',
                        data: data,
                        backgroundColor: 'rgba(255, 45, 149, 0.2)',
                        borderColor: '#ff2d95',
                        borderWidth: 3,
                        pointBackgroundColor: neonColors,
                        pointBorderColor: '#fff',
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        fill: type === 'area',
                        tension: 0.4,
                    }]
                };
                chartOptions = {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#fff' } }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        },
                        y: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255,255,255,0.1)' }
                        }
                    }
                };
            }

            chart = new Chart(ctx, {
                type: chartType,
                data: chartData,
                options: chartOptions
            });
        }

        // 初期表示（サンプルグラフを自動生成）
        window.addEventListener('DOMContentLoaded', () => {
            generateChart();
        });
    </script>
</body>
</html>
