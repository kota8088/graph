<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グラフ作成ツール</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 18px 20px;
            border-bottom: 2px solid #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            border-radius: 0 0 20px 20px;
            background: #0d0f14;
            margin-bottom: 20px;
        }

        header h1 {
            color: #00f0ff;
            text-shadow: 0 0 15px #00f0ff, 0 0 40px rgba(0, 240, 255, 0.4);
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .main-layout {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }

        .sidebar {
            width: 360px;
            padding: 20px;
            background: #0d0f14;
            border: 2px solid #00f0ff;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #00f0ff;
            border-radius: 4px;
        }

        .chart-container {
            flex: 1;
            background: #0d0f14;
            border: 2px solid #ff00a0;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 160, 0.15), inset 0 0 30px rgba(0, 0, 0, 0.5);
            min-height: 600px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }

        #myChart {
            max-width: 100%;
            max-height: 600px;
            width: 100% !important;
            height: auto !important;
        }

        .label {
            display: block;
            margin: 12px 0 4px;
            font-size: 14px;
            color: #00f0ff;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
        }

        select,
        input[type="text"],
        input[type="number"] {
            background: #1a1a2e;
            color: #00f0ff;
            border: 1px solid #00f0ff;
            border-radius: 8px;
            padding: 10px 14px;
            width: 100%;
            font-size: 14px;
            transition: 0.3s;
            outline: none;
        }

        select:focus,
        input:focus {
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            border-color: #ff00a0;
        }

        button {
            background: linear-gradient(135deg, #00f0ff, #ff00a0);
            color: #0a0a0f;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: 0.3s;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.5), 0 0 60px rgba(255, 0, 160, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-group button {
            flex: 1;
            padding: 10px;
            font-size: 13px;
        }

        #downloadBtn {
            width: 100%;
            margin-top: 20px;
            font-size: 16px;
            background: linear-gradient(135deg, #00ff41, #00f0ff);
        }

        .data-input {
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 15px;
        }

        .data-input h3 {
            color: #ff00a0;
            margin-bottom: 10px;
            font-size: 16px;
            text-shadow: 0 0 10px rgba(255, 0, 160, 0.3);
        }

        table#dataTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        #dataTable th,
        #dataTable td {
            padding: 4px 2px;
            border: 1px solid #2a2a4a;
            text-align: center;
            position: relative;
        }

        #dataTable th {
            background: #1a1a2e;
            color: #ff00a0;
            font-size: 13px;
            font-weight: 600;
        }

        #dataTable td input {
            background: transparent;
            border: none;
            color: #fff;
            width: 100%;
            padding: 4px;
            text-align: center;
            font-size: 13px;
        }

        #dataTable td input:focus {
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
            background: rgba(0, 240, 255, 0.05);
            border-radius: 4px;
        }

        #dataTable .del-row {
            background: transparent;
            border: none;
            color: #ff00a0;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 4px;
            line-height: 1;
        }

        #dataTable .del-row:hover {
            background: rgba(255, 0, 160, 0.1);
            border-radius: 4px;
        }

        .empty-msg {
            color: #888;
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }

        @media (max-width: 900px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: none;
            }
            .chart-container {
                min-height: 400px;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 10px;
            }
            .sidebar {
                padding: 12px;
            }
            .chart-container {
                padding: 10px;
                min-height: 300px;
            }
            button {
                padding: 10px 14px;
                font-size: 13px;
            }
        }

        /* 霓虹闪烁动画 */
        @keyframes neonPulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(0, 240, 255, 0.7);
            }
        }
        .chart-container {
            animation: neonPulse 4s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>グラフ作成ツール</h1>
        </header>
        <div class="main-layout">
            <div class="sidebar">
                <label class="label" for="chartType">📈 グラフタイプ</label>
                <select id="chartType">
                    <option value="bar">1. 棒グラフ</option>
                    <option value="line">2. 折れ線グラフ</option>
                    <option value="pie">3. 円グラフ</option>
                    <option value="horizontalBar">4. 帯グラフ</option>
                    <option value="histogram">5. ヒストグラム</option>
                    <option value="scatter">6. 散布図</option>
                    <option value="stackedBar">7. 積み上げ棒</option>
                    <option value="radar">8. レーダー</option>
                    <option value="bubble">9. バブル</option>
                    <option value="boxplot">10. 箱ひげ図</option>
                    <option value="heatmap">11. ヒートマップ</option>
                    <option value="sankey">12. サンキー</option>
                </select>

                <label class="label" for="chartTitle">🏷️ タイトル</label>
                <input type="text" id="chartTitle" placeholder="グラフタイトル..." value="グラフタイトル">

                <div class="data-input">
                    <h3>📊 データ入力</h3>
                    <table id="dataTable"></table>
                    <div class="btn-group">
                        <button id="addRow">➕ 行追加</button>
                    </div>
                </div>

                <button id="downloadBtn">💾 PNGダウンロード</button>
            </div>
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ================== 状態（初期データは空） ==================
        let chartInstance = null;
        let state = {
            chartType: 'bar',
            title: 'グラフタイトル',
            labels: [],
            values: []
        };

        // ================== DOM element ==================
        const chartTypeSelect = document.getElementById('chartType');
        const chartTitleInput = document.getElementById('chartTitle');
        const dataTable = document.getElementById('dataTable');
        const addRowBtn = document.getElementById('addRow');
        const downloadBtn = document.getElementById('downloadBtn');
        const canvas = document.getElementById('myChart');

        const neonColors = ['#00f0ff', '#ff00a0', '#00ff41', '#ffde00', '#ff6b35', '#9d00ff', '#00ffcc', '#ff3881', '#7fff00', '#ff9500', '#00aaff', '#ff2d55'];

        // ================== テーブル描画 ==================
        function renderTable() {
            dataTable.innerHTML = '';
            if (state.labels.length === 0) {
                // 空状態表示
                const trEmpty = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = 3;
                td.style.textAlign = 'center';
                td.style.padding = '20px';
                td.style.color = '#888';
                td.textContent = 'データがありません。下の「行追加」を押してください。';
                trEmpty.appendChild(td);
                dataTable.appendChild(trEmpty);
                return;
            }

            // ヘッダー
            const thead = document.createElement('thead');
            const trHead = document.createElement('tr');
            const th1 = document.createElement('th');
            th1.textContent = 'ラベル';
            const th2 = document.createElement('th');
            th2.textContent = '値';
            const th3 = document.createElement('th');
            th3.textContent = '削除';
            trHead.appendChild(th1);
            trHead.appendChild(th2);
            trHead.appendChild(th3);
            thead.appendChild(trHead);
            dataTable.appendChild(thead);

            // ボディ
            const tbody = document.createElement('tbody');
            state.labels.forEach((label, idx) => {
                const tr = document.createElement('tr');

                const tdLabel = document.createElement('td');
                const inputLabel = document.createElement('input');
                inputLabel.type = 'text';
                inputLabel.value = label;
                inputLabel.placeholder = '項目名';
                inputLabel.addEventListener('input', () => {
                    state.labels[idx] = inputLabel.value;
                });
                tdLabel.appendChild(inputLabel);
                tr.appendChild(tdLabel);

                const tdValue = document.createElement('td');
                const inputValue = document.createElement('input');
                inputValue.type = 'number';
                inputValue.value = state.values[idx];
                inputValue.placeholder = '0';
                inputValue.addEventListener('input', () => {
                    const v = parseFloat(inputValue.value);
                    state.values[idx] = isNaN(v) ? 0 : v;
                });
                tdValue.appendChild(inputValue);
                tr.appendChild(tdValue);

                const tdDel = document.createElement('td');
                const delBtn = document.createElement('button');
                delBtn.textContent = '🗑️';
                delBtn.className = 'del-row';
                delBtn.addEventListener('click', () => {
                    if (state.labels.length <= 1) {
                        alert('少なくとも1つの行が必要です。');
                        return;
                    }
                    state.labels.splice(idx, 1);
                    state.values.splice(idx, 1);
                    renderTable();
                    renderChart();
                });
                tdDel.appendChild(delBtn);
                tr.appendChild(tdDel);

                tbody.appendChild(tr);
            });
            dataTable.appendChild(tbody);
        }

        // ================== Chart.js 汎用 ==================
        function renderChartJS(type, data, options) {
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
            canvas.width = canvas.parentElement.clientWidth - 40;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');
            chartInstance = new Chart(ctx, {
                type: type,
                data: data,
                options: options || {
                    responsive: true,
                    plugins: {
                        title: { display: true, text: state.title, color: '#00f0ff', font: { size: 20 } }
                    }
                }
            });
        }

        function setupCanvas() {
            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }
            canvas.width = canvas.parentElement.clientWidth - 40;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0d0f14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            return ctx;
        }

        // ================== 個別描画（箱ひげ・ヒートマップ・サンキー） ==================
        function drawBoxPlot() {
            const ctx = setupCanvas();
            const W = canvas.width;
            const H = canvas.height;
            const values = state.values.filter(v => !isNaN(v));
            if (values.length === 0) {
                ctx.fillStyle = '#888';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('データがありません', W / 2, H / 2);
                return;
            }

            ctx.fillStyle = '#00f0ff';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(state.title, W / 2, 30);

            const sorted = [...values].sort((a, b) => a - b);
            const min = sorted[0];
            const max = sorted[sorted.length - 1];
            const percentile = (arr, p) => {
                const idx = (arr.length - 1) * p;
                const lo = Math.floor(idx);
                const hi = Math.ceil(idx);
                if (lo === hi) return arr[lo];
                return arr[lo] * (hi - idx) + arr[hi] * (idx - lo);
            };
            const q1 = percentile(sorted, 0.25);
            const median = percentile(sorted, 0.5);
            const q3 = percentile(sorted, 0.75);

            const yMin = min - (max - min) * 0.2 || min - 1;
            const yMax = max + (max - min) * 0.2 || max + 1;
            const x = W / 2;
            const scaleY = (v) => H - 80 - ((v - yMin) / (yMax - yMin)) * (H - 160);

            const boxW = 80;
            ctx.fillStyle = 'rgba(0,240,255,0.2)';
            ctx.strokeStyle = '#00f0ff';
            ctx.lineWidth = 2;
            ctx.fillRect(x - boxW / 2, scaleY(q3), boxW, scaleY(q1) - scaleY(q3));
            ctx.strokeRect(x - boxW / 2, scaleY(q3), boxW, scaleY(q1) - scaleY(q3));
            ctx.strokeStyle = '#ff00a0';
            ctx.beginPath();
            ctx.moveTo(x - boxW / 2, scaleY(median));
            ctx.lineTo(x + boxW / 2, scaleY(median));
            ctx.stroke();
            ctx.strokeStyle = '#00ff41';
            ctx.beginPath();
            ctx.moveTo(x, scaleY(q3));
            ctx.lineTo(x, scaleY(max));
            ctx.moveTo(x - boxW / 4, scaleY(max));
            ctx.lineTo(x + boxW / 4, scaleY(max));
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, scaleY(q1));
            ctx.lineTo(x, scaleY(min));
            ctx.moveTo(x - boxW / 4, scaleY(min));
            ctx.lineTo(x + boxW / 4, scaleY(min));
            ctx.stroke();

            const iqr = q3 - q1;
            sorted.forEach(v => {
                if (v < q1 - 1.5 * iqr || v > q3 + 1.5 * iqr) {
                    ctx.beginPath();
                    ctx.arc(x, scaleY(v), 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff6b35';
                    ctx.fill();
                }
            });

            ctx.fillStyle = '#aaa';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Min:', 20, scaleY(min) + 4);
            ctx.fillText(String(min), 60, scaleY(min) + 4);
            ctx.fillText('Q1:', 20, scaleY(q1) + 4);
            ctx.fillText(String(q1), 60, scaleY(q1) + 4);
            ctx.fillText('中央:', 20, scaleY(median) + 4);
            ctx.fillText(String(median), 60, scaleY(median) + 4);
            ctx.fillText('Q3:', 20, scaleY(q3) + 4);
            ctx.fillText(String(q3), 60, scaleY(q3) + 4);
            ctx.fillText('Max:', 20, scaleY(max) + 4);
            ctx.fillText(String(max), 60, scaleY(max) + 4);
        }

        function drawHeatmap() {
            const ctx = setupCanvas();
            const W = canvas.width;
            const H = canvas.height;
            ctx.fillStyle = '#00f0ff';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(state.title, W / 2, 30);

            const rows = state.labels.length;
            if (rows === 0) {
                ctx.fillStyle = '#888';
                ctx.font = '18px sans-serif';
                ctx.fillText('データがありません', W / 2, H / 2);
                return;
            }
            const values = state.values.map(v => isNaN(v) ? 0 : v);
            const maxVal = Math.max(...values);
            const minVal = Math.min(...values);
            const range = maxVal - minVal || 1;

            const margin = { top: 50, left: 120, right: 40, bottom: 50 };
            const gridW = W - margin.left - margin.right;
            const cellH = 40;
            const cellW = gridW / rows;

            ctx.fillStyle = '#eee';
            ctx.font = '13px sans-serif';
            ctx.textAlign = 'right';
            for (let i = 0; i < rows; i++) {
                ctx.fillText(state.labels[i], margin.left - 10, margin.top + i * cellH + cellH / 2 + 4);
            }

            for (let i = 0; i < rows; i++) {
                const t = (values[i] - minVal) / range;
                const r = Math.min(255, Math.floor(t * 255));
                const b = Math.min(255, Math.floor((1 - t) * 255));
                const g = Math.min(255, Math.floor(100 * t));
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(margin.left + i * cellW, margin.top, cellW - 2, cellH - 2);
                ctx.fillStyle = t > 0.6 ? '#000' : '#fff';
                ctx.textAlign = 'center';
                ctx.font = '12px sans-serif';
                ctx.fillText(String(values[i]), margin.left + i * cellW + cellW / 2, margin.top + cellH / 2 + 4);
            }
            ctx.strokeStyle = '#0d0f14';
            ctx.lineWidth = 1;
            for (let i = 0; i <= rows; i++) {
                ctx.beginPath();
                ctx.moveTo(margin.left + i * cellW, margin.top);
                ctx.lineTo(margin.left + i * cellW, margin.top + cellH);
                ctx.stroke();
            }
        }

        function drawSankey() {
            const ctx = setupCanvas();
            const W = canvas.width;
            const H = canvas.height;
            ctx.fillStyle = '#00f0ff';
            ctx.font = 'bold 20px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(state.title, W / 2, 30);

            const n = state.labels.length;
            if (n === 0) {
                ctx.fillStyle = '#888';
                ctx.font = '18px sans-serif';
                ctx.fillText('データがありません', W / 2, H / 2);
                return;
            }
            const values = state.values.map(v => isNaN(v) ? 0 : v);
            const maxV = Math.max(...values, 1);
            const leftX = 60;
            const rightX = W - 20;
            const topY = 60;
            const botY = H - 60;
            const yPos = (i) => topY + ((i + 0.5) * (botY - topY) / n);

            ctx.fillStyle = '#fff';
            ctx.font = '13px sans-serif';
            ctx.textAlign = 'right';
            state.labels.forEach((label, i) => {
                ctx.fillText(label, leftX - 20, yPos(i) + 4);
            });
            ctx.fillStyle = '#ff00a0';
            ctx.textAlign = 'left';
            ctx.font = 'bold 13px sans-serif';
            values.forEach((v, i) => {
                ctx.fillText(String(v), rightX + 10, yPos(i) + 4);
            });
            const maxW = Math.min(W/4, 60);
            values.forEach((v, i) => {
                if (v === 0) return;
                const lineWidth = Math.max(1, (Math.abs(v) / maxV) * maxW);
                const y = yPos(i);
                const grad = ctx.createLinearGradient(leftX, y, rightX, y);
                grad.addColorStop(0, '#00f0ff');
                grad.addColorStop(1, '#ff00a0');
                ctx.strokeStyle = grad;
                ctx.lineWidth = lineWidth;
                ctx.beginPath();
                ctx.moveTo(leftX, y);
                ctx.bezierCurveTo(leftX + 100, y, rightX - 100, y, rightX, y);
                ctx.stroke();
            });
        }

        // ================== メイン描画 ==================
        function renderChart() {
            const type = state.chartType;

            // カスタム描画
            if (type === 'boxplot') return drawBoxPlot();
            if (type === 'heatmap') return drawHeatmap();
            if (type === 'sankey') return drawSankey();

            // データが空なら空表示
            if (state.labels.length === 0) {
                if (chartInstance) {
                    chartInstance.destroy();
                    chartInstance = null;
                }
                const ctx = setupCanvas();
                ctx.fillStyle = '#888';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('データを入力してください', canvas.width / 2, canvas.height / 2);
                return;
            }

            const labels = [...state.labels];
            const values = [...state.values];

            if (type === 'histogram') {
                const cleanValues = values.filter(v => !isNaN(v));
                if (cleanValues.length === 0) {
                    renderChartJS('bar', { labels: ['データなし'], datasets: [{ data: [0] }] });
                    return;
                }
                const binCount = Math.min(8, Math.max(4, Math.round(Math.sqrt(cleanValues.length))));
                const min = Math.min(...cleanValues);
                const max = Math.max(...cleanValues);
                if (min === max) {
                    renderChartJS('bar', { labels: [String(min)], datasets: [{ data: [cleanValues.length] }] }, {
                        responsive: true,
                        plugins: { title: { display: true, text: state.title, color: '#00f0ff' } }
                    });
                    return;
                }
                const binSize = (max - min) / binCount;
                const counts = new Array(binCount).fill(0);
                cleanValues.forEach(v => {
                    let idx = Math.floor((v - min) / binSize);
                    if (idx === binCount) idx--;
                    counts[idx]++;
                });
                const binLabels = [];
                for (let i = 0; i < binCount; i++) {
                    binLabels.push((min + i * binSize).toFixed(1) + '〜');
                }
                renderChartJS('bar', {
                    labels: binLabels,
                    datasets: [{
                        label: '頻度',
                        data: counts,
                        backgroundColor: neonColors[2],
                        borderColor: neonColors[2],
                        borderWidth: 1
                    }]
                }, {
                    responsive: true,
                    plugins: { title: { display: true, text: state.title, color: '#00f0ff' } },
                    scales: { y: { beginAtZero: true } }
                });
                return;
            }

            let data, options = {
                responsive: true,
                plugins: { title: { display: true, text: state.title, color: '#00f0ff', font: { size: 20 } } }
            };

            switch (type) {
                case 'bar':
                    data = {
                        labels: labels,
                        datasets: [{
                            label: '値',
                            data: values,
                            backgroundColor: neonColors[0],
                            borderColor: neonColors[0],
                            borderWidth: 1,
                            borderRadius: 6
                        }]
                    };
                    break;
                case 'line':
                    data = {
                        labels: labels,
                        datasets: [{
                            label: '値',
                            data: values,
                            borderColor: neonColors[0],
                            backgroundColor: 'transparent',
                            tension: 0.4,
                            pointBackgroundColor: neonColors[0],
                            borderWidth: 2
                        }]
                    };
                    break;
                case 'pie':
                    data = {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: neonColors.slice(0, labels.length),
                            borderColor: '#0d0f14',
                            borderWidth: 2
                        }]
                    };
                    break;
                case 'horizontalBar':
                    data = {
                        labels: labels,
                        datasets: [{
                            label: '値',
                            data: values,
                            backgroundColor: neonColors[0],
                            borderColor: neonColors[0],
                            borderWidth: 1
                        }]
                    };
                    options.indexAxis = 'y';
                    options.scales = { x: { beginAtZero: true } };
                    break;
                case 'scatter':
                    data = {
                        datasets: [{
                            label: '値',
                            data: values.map((v, i) => ({ x: i + 1, y: v })),
                            backgroundColor: neonColors[0],
                            pointRadius: 6,
                            pointBackgroundColor: neonColors[0]
                        }]
                    };
                    options.scales = { y: { beginAtZero: true }, x: { title: { display: true, text: 'index' } } };
                    break;
                case 'stackedBar':
                    data = {
                        labels: labels,
                        datasets: [{
                            label: '値',
                            data: values,
                            backgroundColor: neonColors[0],
                            borderColor: neonColors[0]
                        }]
                    };
                    options.scales = { x: { stacked: true }, y: { stacked: true } };
                    break;
                case 'radar':
                    data = {
                        labels: labels,
                        datasets: [{
                            label: '値',
                            data: values,
                            borderColor: neonColors[0],
                            backgroundColor: neonColors[0] + '55',
                            pointBackgroundColor: neonColors[0],
                            pointRadius: 4
                        }]
                    };
                    options.scales = { r: { beginAtZero: true } };
                    break;
                case 'bubble':
                    data = {
                        datasets: [{
                            label: '値',
                            data: values.map((v, i) => ({ x: i + 1, y: v, r: Math.max(4, Math.abs(v) / 2) })),
                            backgroundColor: 'rgba(255, 0, 160, 0.3)',
                            borderColor: '#ff00a0',
                            borderWidth: 2
                        }]
                    };
                    options.scales = { y: { beginAtZero: true }, x: { title: { display: true, text: 'index' } } };
                    break;
                default:
                    data = { labels: [], datasets: [] };
            }
            renderChartJS(type, data, options);
        }

        // ================== タイトル更新 ==================
        function updateTitle() {
            state.title = chartTitleInput.value;
            if (chartInstance) {
                chartInstance.options.plugins.title.text = state.title;
                chartInstance.update();
            } else if (['boxplot', 'heatmap', 'sankey'].includes(state.chartType)) {
                renderChart();
            }
        }

        // ================== ダウンロード ==================
        function downloadPNG() {
            const fileName = state.title.replace(/[\\/:*?"<>|]/g, '_') || 'chart';
            const link = document.createElement('a');
            link.download = fileName + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // ================== イベント ==================
        chartTypeSelect.addEventListener('change', () => {
            state.chartType = chartTypeSelect.value;
            renderChart();
        });

        chartTitleInput.addEventListener('input', updateTitle);

        addRowBtn.addEventListener('click', () => {
            state.labels.push('');
            state.values.push(0);
            renderTable();
            renderChart();
        });

        downloadBtn.addEventListener('click', downloadPNG);

        window.addEventListener('resize', () => {
            if (['boxplot', 'heatmap', 'sankey'].includes(state.chartType)) {
                renderChart();
            } else if (chartInstance) {
                chartInstance.resize();
            }
        });

        // ================== 初期化 ==================
        renderTable();
        renderChart();
    </script>
</body>
</html>
