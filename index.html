<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>グラフ作成ツール（デモ）</title>

  <!-- ファビコン（📊 絵文字をSVGで表示） -->
  <link rel="icon" sizes="any" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E📊%3C/text%3E%3C/svg%3E">

  <!-- Chart.js　本体 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- 追加プラグイン：箱ひげ図 -->
  <script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.2.1/dist/chartjs-chart-boxplot.min.js"></script>
  <!-- 追加プラグイン：ヒートマップ（matrix） -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@2.0.1/dist/chartjs-chart-matrix.min.js"></script>
  <!-- 追加プラグイン：サンキーダイアグラム -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@0.12.0/dist/chartjs-chart-sankey.min.js"></script>

  <style>
    /* ===== リセットと基本スタイル ===== */
    * {
      box-sizing: border-box;
    }

    .cyber-graph-generator {
      --cyber-bg: #0b0d1a;
      --cyber-neon-blue: #00f0ff;
      --cyber-neon-pink: #ff00aa;
      --cyber-neon-purple: #9d00ff;
      --cyber-neon-green: #00ff9d;
      --cyber-text: #e0e4ff;
      --cyber-panel-bg: rgba(20, 24, 45, 0.85);
      --cyber-border: #2a2f4f;

      font-family: 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(circle at 20% 30%, #181c34, var(--cyber-bg));
      color: var(--cyber-text);
      padding: 2rem 1.5rem;
      border-radius: 28px;
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.3), 0 0 20px rgba(255, 0, 170, 0.2);
      max-width: 1500px;
      margin: 2rem auto;
      border: 1px solid var(--cyber-border);
      position: relative;
      z-index: 1;
    }

    .cyber-graph-generator::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255, 0, 170, 0.12), rgba(0, 240, 255, 0.05));
      border-radius: inherit;
      pointer-events: none;
      z-index: -1;
    }

    .cyber-section-title {
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 0 12px var(--cyber-neon-blue), 0 0 24px var(--cyber-neon-pink);
      margin: 0 0 1.5rem;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* レイアウト（左右2カラム） */
    .cyber-layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 2fr;
      gap: 24px;
    }

    .cyber-sidebar {
      background: var(--cyber-panel-bg);
      border-radius: 18px;
      padding: 1.5rem;
      border: 1px solid var(--cyber-border);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .cyber-main {
      background: var(--cyber-panel-bg);
      border-radius: 18px;
      padding: 1.5rem;
      border: 1px solid var(--cyber-border);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
    }

    .cyber-canvas-wrap {
      flex: 1;
      background: #05070f;
      border-radius: 14px;
      padding: 12px;
      border: 1px solid #1e2340;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
      position: relative;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cyber-canvas {
      width: 100% !important;
      height: 100% !important;
      max-height: 65vh;
    }

    /* フォーム共通 */
    .cyber-field {
      margin-bottom: 1.25rem;
    }

    .cyber-label {
      display: block;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      color: var(--cyber-neon-blue);
      text-shadow: 0 0 6px var(--cyber-neon-blue);
    }

    .cyber-input,
    .cyber-select {
      width: 100%;
      padding: 10px 12px;
      background: #11142a;
      border: 1px solid var(--cyber-border);
      border-radius: 10px;
      color: var(--cyber-text);
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .cyber-input:focus,
    .cyber-select:focus {
      outline: none;
      border-color: var(--cyber-neon-blue);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.3);
    }

    .cyber-select option {
      background: #11142a;
      color: #e0e4ff;
    }

    /* 入力モード切り替え */
    .cyber-mode-switch {
      display: flex;
      gap: 6px;
      background: #0c0f1e;
      padding: 6px;
      border-radius: 24px;
      border: 1px solid var(--cyber-border);
    }

    .cyber-mode-radio {
      display: none;
    }

    .cyber-mode-label {
      flex: 1;
      text-align: center;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      border: 1px solid transparent;
    }

    .cyber-mode-radio:checked + .cyber-mode-label {
      background: linear-gradient(135deg, var(--cyber-neon-blue), var(--cyber-neon-purple));
      color: #05070f;
      font-weight: 600;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
      border-color: var(--cyber-neon-blue);
    }

    /* データパネル */
    .cyber-data-panel {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed #2a2f4f;
    }

    .cyber-panel-caption {
      font-size: 0.85rem;
      color: #b0b8d0;
      margin: 0 0 10px;
    }

    .cyber-data-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .cyber-data-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .cyber-data-row .cyber-input {
      padding: 8px 10px;
      font-size: 0.95rem;
    }

    .cyber-label-input {
      flex: 2;
    }

    .cyber-value-input {
      flex: 1;
    }

    .cyber-freq-class-input {
      flex: 3;
    }

    .cyber-freq-count-input {
      flex: 1;
    }

    /* ボタン */
    .cyber-btn {
      background: linear-gradient(135deg, #0e1428, #1a1f3a);
      border: 1px solid #2a2f4f;
      color: var(--cyber-neon-blue);
      padding: 8px 16px;
      border-radius: 24px;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.15);
    }

    .cyber-btn:hover {
      background: linear-gradient(135deg, #1a1f3a, #0e1428);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.5);
      transform: translateY(-1px);
    }

    .cyber-btn-delete {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #241235;
      color: var(--cyber-neon-pink);
      border-color: #5a1a48;
      flex-shrink: 0;
    }

    .cyber-btn-delete:hover {
      background: #3a1a3e;
      box-shadow: 0 0 14px #ff00aa;
    }

    .cyber-btn-add {
      width: 100%;
      background: transparent;
      border-style: dashed;
      border-color: var(--cyber-neon-blue);
    }

    .cyber-btn-download {
      width: 100%;
      background: linear-gradient(135deg, #00d0c0, #0080ff);
      color: #05070f;
      border: none;
      font-weight: 700;
      padding: 12px;
      border-radius: 30px;
      font-size: 1.1rem;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      margin-top: 12px;
    }

    .cyber-btn-download:hover {
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
    }

    /* レスポンシブ */
    @media (max-width: 900px) {
      .cyber-layout {
        grid-template-columns: 1fr;
      }
      .cyber-section-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <section id="cyber-graph-generator" class="cyber-graph-generator">

    <h2 class="cyber-section-title">📊 グラフ作成ツール</h2>

    <div class="cyber-layout">
      <!-- 左カラム -->
      <div class="cyber-sidebar">

        <div class="cyber-field">
          <label for="cyber-chart-title" class="cyber-label">グラフタイトル</label>
          <input type="text" id="cyber-chart-title" class="cyber-input cyber-chart-title-input"
                 data-role="chart-title-input" value="新しいグラフ" placeholder="グラフのタイトルを入力">
        </div>

        <div class="cyber-field">
          <label for="cyber-chart-type" class="cyber-label">グラフの種類</label>
          <select id="cyber-chart-type" class="cyber-select" data-role="chart-type">
            <option value="bar">棒グラフ</option>
            <option value="line">折れ線グラフ</option>
            <option value="doughnut">円グラフ</option>
            <option value="horizontalBar">帯グラフ（横向き積み上げ棒グラフ）</option>
            <option value="histogram">ヒストグラム（柱状グラフ ※度数分布表と連動）</option>
            <option value="scatter">散布図</option>
            <option value="stackedBar">積み上げ棒グラフ</option>
            <option value="radar">レーダーチャート</option>
            <option value="bubble">バブルチャート</option>
            <option value="boxplot">箱ひげ図</option>
            <option value="heatmap">ヒートマップ</option>
            <option value="sankey">サンキーダイアグラム</option>
          </select>
        </div>

        <div class="cyber-field">
          <span class="cyber-label">入力モード</span>
          <div class="cyber-mode-switch" role="radiogroup" aria-label="入力モード">
            <input type="radio" name="cyber-input-mode" id="cyber-mode-normal" value="normal"
                   class="cyber-mode-radio" data-role="input-mode" checked>
            <label for="cyber-mode-normal" class="cyber-mode-label">通常データ入力</label>

            <input type="radio" name="cyber-input-mode" id="cyber-mode-freq" value="frequency"
                   class="cyber-mode-radio" data-role="input-mode">
            <label for="cyber-mode-freq" class="cyber-mode-label">度数分布表入力</label>
          </div>
        </div>

        <!-- 通常データ入力パネル -->
        <div id="cyber-normal-panel" class="cyber-data-panel cyber-mode-panel" data-mode="normal">
          <p class="cyber-panel-caption">項目名（ラベル）と数値を入力してください。</p>
          <div id="cyber-normal-list" class="cyber-data-list" data-role="data-list" data-list-type="normal">
            <div class="cyber-data-row cyber-normal-row">
              <input type="text" class="cyber-input cyber-label-input" data-role="item-label"
                     placeholder="項目名（例：A社）" aria-label="項目名">
              <input type="number" class="cyber-input cyber-value-input" data-role="item-value"
                     placeholder="数値" step="any" aria-label="数値">
              <button type="button" class="cyber-btn cyber-btn-delete" data-role="delete-row"
                      aria-label="この行を削除">×</button>
            </div>
          </div>
          <button type="button" class="cyber-btn cyber-btn-add" data-role="add-row"
                  data-target="cyber-normal-list">＋ データを追加</button>
        </div>

        <!-- 度数分布表入力パネル -->
        <div id="cyber-freq-panel" class="cyber-data-panel cyber-mode-panel" data-mode="frequency" hidden>
          <p class="cyber-panel-caption">階級（区間・範囲）と度数を入力してください。<br>
          ※ヒストグラム／累積度数折れ線グラフ用データとしてJavaScript側で利用できます。</p>
          <div id="cyber-freq-list" class="cyber-data-list" data-role="data-list" data-list-type="frequency">
            <div class="cyber-data-row cyber-freq-row">
              <input type="text" class="cyber-input cyber-freq-class-input" data-role="freq-class"
                     placeholder="例：0以上10未満" aria-label="階級（区間・範囲）">
              <input type="number" class="cyber-input cyber-freq-count-input" data-role="freq-count"
                     placeholder="度数" min="0" step="1" aria-label="度数">
              <button type="button" class="cyber-btn cyber-btn-delete" data-role="delete-row"
                      aria-label="この行を削除">×</button>
            </div>
          </div>
          <button type="button" class="cyber-btn cyber-btn-add" data-role="add-row"
                  data-target="cyber-freq-list">＋ 階級・度数を追加</button>
        </div>

        <div class="cyber-field cyver-download-area">
          <button type="button" id="cyber-download-btn" class="cyber-btn cyber-btn-download"
                  data-role="download-png">⬇ PNGダウンロード</button>
        </div>

      </div>

      <!-- 右カラム -->
      <div class="cyber-main">
        <div class="cyber-canvas-wrap">
          <canvas id="cyber-chart-canvas" class="cyber-canvas" role="img"
                  aria-label="グラフ描画エリア"></canvas>
        </div>
      </div>
    </div>
  </section>

  <script>
    (function() {
      'use strict';

      // ===== DOM 参照 =====
      const canvas = document.getElementById('cyber-chart-canvas');
      const ctx = canvas.getContext('2d');
      const chartTitleInput = document.querySelector('[data-role="chart-title-input"]');
      const chartTypeSelect = document.querySelector('[data-role="chart-type"]');
      const modeRadios = document.querySelectorAll('[data-role="input-mode"]');
      const normalPanel = document.getElementById('cyber-normal-panel');
      const freqPanel = document.getElementById('cyber-freq-panel');
      const normalList = document.querySelector('[data-list-type="normal"]');
      const freqList = document.querySelector('[data-list-type="frequency"]');
      const downloadBtn = document.getElementById('cyber-download-btn');

      // 現在のグラフインスタンス
      let chart = null;

      // ===== 初期設定 =====
      // デフォルトグラフ（棒グラフ）
      function createChart() {
        if (chart) chart.destroy();
        const data = gatherData();
        chart = buildChart(data);
      }

      // ===== データ取得 =====
      function gatherData() {
        const mode = getInputMode();
        if (mode === 'normal') {
          return getNormalData();
        } else {
          return getFreqData();
        }
      }

      function getInputMode() {
        const checkedRadio = document.querySelector('input[name="cyber-input-mode"]:checked');
        return checkedRadio ? checkedRadio.value : 'normal';
      }

      function getNormalData() {
        const rows = normalList.querySelectorAll('.cyber-data-row');
        const labels = [];
        const values = [];
        rows.forEach(row => {
          const labelInput = row.querySelector('[data-role="item-label"]');
          const valueInput = row.querySelector('[data-role="item-value"]');
          const label = labelInput.value.trim();
          const value = parseFloat(valueInput.value);
          if (label !== '' && !isNaN(value)) {
            labels.push(label);
            values.push(value);
          }
        });
        return { labels, values };
      }

      function getFreqData() {
        const rows = freqList.querySelectorAll('.cyber-data-row');
        const labels = [];
        const values = [];
        rows.forEach(row => {
          const classInput = row.querySelector('[data-role="freq-class"]');
          const countInput = row.querySelector('[data-role="freq-count"]');
          const label = classInput.value.trim();
          const value = parseInt(countInput.value, 10);
          if (label !== '' && !isNaN(value)) {
            labels.push(label);
            values.push(value);
          }
        });
        return { labels, values };
      }

      // ===== グラフ構築 =====
      function buildChart(data) {
        const type = chartTypeSelect.value;
        const mode = getInputMode();
        const labels = data.labels;
        const values = data.values;
        const title = chartTitleInput.value || '新しいグラフ';

        // 基本オプション
        const baseOptions = {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            title: {
              display: true,
              text: title,
              color: '#00f0ff',
              font: { size: 20, weight: 'bold' },
              padding: { top: 8, bottom: 8 }
            },
            legend: {
              labels: { color: '#e0e4ff' }
            }
          },
          scales: {
            x: { ticks: { color: '#b0b8d0' }, grid: { color: 'rgba(40, 50, 100, 0.5)' } },
            y: { ticks: { color: '#b0b8d0' }, grid: { color: 'rgba(40, 50, 100, 0.5)' } }
          }
        };

        // チャートタイプごとのデータセット生成
        let config = {};

        switch (type) {
          case 'bar':
            config = {
              type: 'bar',
              data: {
                labels: labels,
                datasets: [{
                  label: 'データ',
                  data: values,
                  backgroundColor: 'rgba(0, 240, 255, 0.7)',
                  borderColor: '#00f0ff',
                  borderWidth: 2,
                  borderRadius: 4
                }]
              },
              options: { ...baseOptions }
            };
            break;

          case 'line':
            // 度数分布表モードなら累積度数折れ線にする
            if (mode === 'frequency') {
              const cumulative = values.reduce((acc, val, i) => {
                acc.push((acc.length > 0 ? acc[i-1] : 0) + val);
                return acc;
              }, []);
              config = {
                type: 'line',
                data: {
                  labels: labels,
                  datasets: [{
                    label: '累積度数',
                    data: cumulative,
                    borderColor: '#ff00aa',
                    backgroundColor: 'rgba(255, 0, 170, 0.2)',
                    borderWidth: 3,
                    pointBackgroundColor: '#fff',
                    fill: true,
                    tension: 0.2
                  }]
                },
                options: { ...baseOptions }
              };
            } else {
              config = {
                type: 'line',
                data: {
                  labels: labels,
                  datasets: [{
                    label: 'データ',
                    data: values,
                    borderColor: '#00ff9d',
                    backgroundColor: 'rgba(0, 255, 157, 0.1)',
                    borderWidth: 3,
                    pointBackgroundColor: '#00ff9d',
                    tension: 0.3
                  }]
                },
                options: { ...baseOptions }
              };
            }
            break;

          case 'doughnut':
            config = {
              type: 'doughnut',
              data: {
                labels: labels,
                datasets: [{
                  label: 'データ',
                  data: values,
                  backgroundColor: [
                    '#ff00aa', '#00f0ff', '#9d00ff', '#00ff9d', '#ffcc00',
                    '#ff6600', '#5533ff', '#ff3366', '#33ff99', '#aa66ff'
                  ],
                  borderColor: '#0b0d1a',
                  borderWidth: 3
                }]
              },
              options: { ...baseOptions, scales: undefined }
            };
            break;

          case 'horizontalBar':
            config = {
              type: 'bar',
              data: {
                labels: labels,
                datasets: [{
                  label: 'データ',
                  data: values,
                  backgroundColor: 'rgba(255, 0, 170, 0.7)',
                  borderColor: '#ff00aa',
                  borderWidth: 2
                }]
              },
              options: {
                ...baseOptions,
                indexAxis: 'y'
              }
            };
            break;

          case 'histogram':
            // 度数分布表のデータをそのまま棒グラフで表現（ヒストグラム）
            config = {
              type: 'bar',
              data: {
                labels: labels,
                datasets: [{
                  label: '度数',
                  data: values,
                  backgroundColor: 'rgba(0, 240, 255, 0.8)',
                  borderColor: '#00f0ff',
                  borderWidth: 1,
                  barPercentage: 1.0,
                  categoryPercentage: 1.0
                }]
              },
              options: {
                ...baseOptions,
                scales: {
                  ...baseOptions.scales,
                  x: { ...baseOptions.scales.x, barPercentage: 1.0, categoryPercentage: 1.0 }
                }
              }
            };
            break;

          case 'scatter':
            // 正常データを散布図風に：値をxとyに分割
            const scatterData = values.map((v, i) => ({ x: i + 1, y: v }));
            config = {
              type: 'scatter',
              data: {
                datasets: [{
                  label: '散布図 (入力値)',
                  data: scatterData,
                  backgroundColor: '#ff00aa',
                  borderColor: '#ff00aa',
                  pointRadius: 6
                }]
              },
              options: baseOptions
            };
            break;

          case 'stackedBar':
            // 正常データを積み上げ棒グラフ風に（単一系列のため1本の棒）
            config = {
              type: 'bar',
              data: {
                labels: labels.length ? labels : ['データ'],
                datasets: [{
                  label: '系列1',
                  data: values.length ? values : [0],
                  backgroundColor: '#00f0ff',
                  borderColor: '#00f0ff'
                }]
              },
              options: {
                ...baseOptions,
                scales: {
                  ...baseOptions.scales,
                  x: { ...baseOptions.scales.x, stacked: true },
                  y: { ...baseOptions.scales.y, stacked: true }
                }
              }
            };
            break;

          case 'radar':
            config = {
              type: 'radar',
              data: {
                labels: labels,
                datasets: [{
                  label: 'データ',
                  data: values,
                  borderColor: '#00ff9d',
                  backgroundColor: 'rgba(0, 255, 157, 0.2)',
                  borderWidth: 2,
                  pointBackgroundColor: '#00ff9d'
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                  title: { display: true, text: title, color: '#00f0ff', font: { size: 20 } }
                },
                scales: {
                  r: {
                    grid: { color: 'rgba(255,255,255,0.2)' },
                    ticks: { color: '#b0b8d0' },
                    pointLabels: { color: '#e0e4ff' }
                  }
                }
              }
            };
            break;

          case 'bubble':
            // バブルチャート（値に応じてバブルサイズ）
            const bubbleData = values.map((v, i) => ({ x: i + 1, y: v, r: Math.max(5, Math.abs(v) % 20) })); 
            config = {
              type: 'bubble',
              data: {
                datasets: [{
                  label: 'バブル',
                  data: bubbleData,
                  backgroundColor: 'rgba(255, 0, 170, 0.5)',
                  borderColor: '#ff00aa',
                  borderWidth: 2
                }]
              },
              options: baseOptions
            };
            break;

          case 'boxplot':
            // 箱ひげ図（プラグイン）: 入力値から簡易的な箱ひげデータを生成
            const sorted = values.slice().sort((a, b) => a - b);
            if (sorted.length === 0) sorted.push(0);
            const q1 = sorted[Math.floor(sorted.length * 0.25)];
            const med = sorted[Math.floor(sorted.length * 0.5)];
            const q3 = sorted[Math.floor(sorted.length * 0.75)];
            const min = sorted[0];
            const max = sorted[sorted.length - 1];
            const boxData = [[min, q1, med, q3, max]];
            config = {
              type: 'boxplot',
              data: {
                labels: ['データ'],
                datasets: [{
                  label: '箱ひげ図',
                  data: boxData,
                  backgroundColor: 'rgba(0, 240, 255, 0.4)',
                  borderColor: '#00f0ff',
                  borderWidth: 2
                }]
              },
              options: baseOptions
            };
            break;

          case 'heatmap':
            // ヒートマップ（matrixプラグイン）：行列風データを入力値から生成
            const heatData = [];
            labels.forEach((label, i) => {
              if (values[i] !== undefined) {
                heatData.push({ x: i, y: 0, v: values[i] });
              }
            });
            config = {
              type: 'matrix',
              data: {
                datasets: [{
                  label: 'ヒートマップ',
                  data: heatData,
                  backgroundColor(context) {
                    const v = context.dataset.data[context.dataIndex].v;
                    const alpha = Math.min(1, Math.abs(v) / 100);
                    return v >= 0 ? `rgba(0, 240, 255, ${alpha})` : `rgba(255, 0, 170, ${alpha})`;
                  },
                  borderWidth: 1,
                  borderColor: '#0b0d1a',
                  width: 60,
                  height: 60
                }]
              },
              options: {
                ...baseOptions,
                scales: {
                  x: { ticks: { display: false }, grid: { display: false } },
                  y: { ticks: { display: false }, grid: { display: false } }
                }
              }
            };
            break;

          case 'sankey':
            // サンキーダイアグラム：入力データをサンキー風のフローに変換
            const nodes = [];
            const edges = [];
            labels.forEach((label, i) => {
              nodes.push({ id: label.length ? label : `node${i}` });
              if (i < 2 && values[i] !== undefined) {
                // フローのための擬似エッジ
                edges.push({
                  from: labels[0] || 'root',
                  to: labels[i] || `node${i}`,
                  flow: values[i]
                });
              }
            });
            // 最低限のサンキーデータ
            const sankeyData = {
              nodes: nodes.length ? nodes : [{ id: 'A' }, { id: 'B' }],
              edges: edges.length ? edges : [{ from: 'A', to: 'B', flow: 10 }]
            };
            config = {
              type: 'sankey',
              data: {
                datasets: [{
                  label: 'サンキー',
                  data: sankeyData,
                  colorFrom: '#00f0ff',
                  colorTo: '#ff00aa',
                  colorMode: 'gradient'
                }]
              },
              options: baseOptions
            };
            break;

          default:
            config = {
              type: 'bar',
              data: {
                labels: labels,
                datasets: [{
                  label: 'データ',
                  data: values,
                  backgroundColor: 'rgba(0, 240, 255, 0.7)'
                }]
              },
              options: baseOptions
            };
        }

        // Chart.js で描画
        try {
          return new Chart(ctx, config);
        } catch (e) {
          console.error('グラフ描画エラー:', e);
          // エラー時は棒グラフにフォールバック
          const fallbackConfig = {
            type: 'bar',
            data: {
              labels: labels,
              datasets: [{
                label: 'エラー（データを確認）',
                data: values,
                backgroundColor: 'rgba(255,0,0,0.5)'
              }]
            },
            options: baseOptions
          };
          return new Chart(ctx, fallbackConfig);
        }
      }

      // ===== モード切り替え =====
      function switchMode(mode) {
        if (mode === 'normal') {
          normalPanel.hidden = false;
          freqPanel.hidden = true;
        } else {
          normalPanel.hidden = true;
          freqPanel.hidden = false;
        }
        updateChart();
      }

      // ===== 行追加・削除 =====
      function addRow(targetListId) {
        const list = document.getElementById(targetListId);
        const isFreq = list.dataset.listType === 'frequency';
        const row = document.createElement('div');
        row.className = 'cyber-data-row' + (isFreq ? ' cyber-freq-row' : ' cyber-normal-row');

        if (isFreq) {
          row.innerHTML = `
            <input type="text" class="cyber-input cyber-freq-class-input" data-role="freq-class"
                   placeholder="例：0以上10未満" aria-label="階級（区間・範囲）">
            <input type="number" class="cyber-input cyber-freq-count-input" data-role="freq-count"
                   placeholder="度数" min="0" step="1" aria-label="度数">
            <button type="button" class="cyber-btn cyber-btn-delete" data-role="delete-row"
                    aria-label="この行を削除">×</button>
          `;
        } else {
          row.innerHTML = `
            <input type="text" class="cyber-input cyber-label-input" data-role="item-label"
                   placeholder="項目名（例：A社）" aria-label="項目名">
            <input type="number" class="cyber-input cyber-value-input" data-role="item-value"
                   placeholder="数値" step="any" aria-label="数値">
            <button type="button" class="cyber-btn cyber-btn-delete" data-role="delete-row"
                    aria-label="この行を削除">×</button>
          `;
        }
        list.appendChild(row);
        attachRowEvents(row);
      }

      function deleteRow(row) {
        const list = row.parentNode;
        // 最低1行は残す（初期行の削除防止）
        if (list.querySelectorAll('.cyber-data-row').length > 1) {
          row.remove();
          updateChart();
        } else {
          // 1行だけなら入力をクリア
          row.querySelectorAll('input').forEach(input => input.value = '');
        }
      }

      function attachRowEvents(row) {
        const deleteBtn = row.querySelector('[data-role="delete-row"]');
        if (deleteBtn) {
          deleteBtn.addEventListener('click', () => deleteRow(row));
        }
        row.querySelectorAll('input').forEach(input => {
          input.addEventListener('input', updateChart);
          input.addEventListener('change', updateChart);
        });
      }

      // ===== グラフ更新 =====
      function updateChart() {
        if (chart) chart.destroy();
        const data = gatherData();
        chart = buildChart(data);
      }

      // ===== ダウンロード =====
      function downloadPNG() {
        const title = chartTitleInput.value || 'グラフ';
        const link = document.createElement('a');
        link.download = title + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      // ===== イベントリスナー設定 =====
      function init() {
        // モード切り替え
        modeRadios.forEach(radio => {
          radio.addEventListener('change', (e) => {
            switchMode(e.target.value);
          });
        });

        // 追加ボタン
        document.querySelectorAll('[data-role="add-row"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const targetId = e.target.dataset.target;
            addRow(targetId);
          });
        });

        // 初期行にイベント付与
        document.querySelectorAll('.cyber-data-row').forEach(row => attachRowEvents(row));

        // グラフタイトル変更
        chartTitleInput.addEventListener('input', updateChart);

        // グラフ種類変更
        chartTypeSelect.addEventListener('change', updateChart);

        // ダウンロードボタン
        downloadBtn.addEventListener('click', downloadPNG);

        // 初期描画
        switchMode('normal');
      }

      // 実行
      init();

    })();
  </script>
</body>
</html>
