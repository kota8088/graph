<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グラフ作成サイト</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            padding: 30px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 2.2rem;
        }
        .layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
        .controls {
            background: #f7f7f7;
            border-radius: 15px;
            padding: 20px;
        }
        .controls h2 {
            color: #555;
            margin-bottom: 20px;
            font-size: 1.2rem;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #444;
        }
        .control-group select,
        .control-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            transition: border-color 0.3s;
        }
        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #555;
        }
        .btn-secondary:hover {
            background: #444;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .data-entry {
            margin-bottom: 20px;
        }
        .data-entry textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            resize: vertical;
            background: white;
        }
        .chart-wrap {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .canvas-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 グラフ作成サイト</h1>
        <p style="text-align:center;color:#888;margin-bottom:30px;">
            CSV形式でデータを入力し、さまざまなグラフを即座に作成できます。
        </p>
        
        <div class="layout">
            <!-- 左側：コントロールパネル -->
            <div class="controls">
                <h2>⚙️ 設定</h2>
                
                <!-- グラフタイプ -->
                <div class="control-group">
                    <label for="chartType">グラフタイプ</label>
                    <select id="chartType">
                        <option value="line">折れ線グラフ</option>
                        <option value="bar">棒グラフ</option>
                        <option value="pie">円グラフ</option>
                        <option value="doughnut">ドーナツグラフ</option>
                        <option value="radar">レーダーチャート</option>
                        <option value="polarArea">極座標グラフ</option>
                        <option value="bubble">バブルチャート</option>
                        <option value="scatter">散布図</option>
                    </select>
                </div>

                <!-- データ入力 -->
                <div class="data-entry">
                    <label for="dataInput">データ（CSV形式）</label>
                    <textarea id="dataInput" placeholder="ラベル, 値&#10;例）1月, 100&#10;2月, 150&#10;3月, 200&#10;4月, 180">1月, 120
2月, 150
3月, 170
4月, 110
5月, 200
6月, 180</textarea>
                </div>

                <!-- タイトルとラベル -->
                <div class="control-group">
                    <label for="title">グラフタイトル</label>
                    <input type="text" id="title" value="月別売上推移">
                </div>
                <div class="control-group">
                    <label for="xlabel">X軸ラベル</label>
                    <input type="text" id="xlabel" value="月">
                </div>
                <div class="control-group">
                    <label for="ylabel">Y軸ラベル</label>
                    <input type="text" id="ylabel" value="売上（万円）">
                </div>

                <!-- 色設定 -->
                <div class="control-group">
                    <label for="color">グラフ色</label>
                    <input type="color" id="color" value="#667eea">
                </div>

                <!-- ボタン -->
                <button class="btn" onclick="updateChart()">🔄 グラフ更新</button>
                <button class="btn btn-secondary" onclick="randomData()">🎲 ランダムデータ生成</button>
                <button class="btn btn-secondary" onclick="addSampleData()">📋 サンプルデータ投入</button>
                <button class="btn btn-secondary" onclick="exportPNG()">💾 PNGで保存</button>
            </div>

            <!-- 右側：グラフ表示 -->
            <div class="chart-wrap">
                <div class="canvas-container">
                    <canvas id="myChart"></canvas>
                </div>
                <div style="text-align:center;margin-top:15px;" id="stats">データ数：6 件</div>
            </div>
        </div>
        <div class="footer">
            Chart.js v4.4.0 を使用 | ご利用ありがとうございます。
        </div>
    </div>

    <script>
        let myChart = null;

        // 初期化
        window.onload = function() {
            updateChart();
        };

        // データを取得（CSV文字列 → 配列）
        function parseData(text) {
            const lines = text.trim().split('\n');
            const labels = [];
            const values = [];
            for (let line of lines) {
                line = line.trim();
                if (!line) continue;
                // 区切り文字はカンマ、タブ、スペースに対応
                const parts = line.split(/[,\t ]+/);
                if (parts.length >= 2) {
                    labels.push(parts[0]);
                    values.push(parseFloat(parts[1]));
                }
            }
            return { labels, values };
        }

        // グラフを更新
        function updateChart() {
            const dataText = document.getElementById('dataInput').value;
            const { labels, values } = parseData(dataText);
            if (labels.length === 0) {
                alert('データが正しく入力されていません');
                return;
            }

            const type = document.getElementById('chartType').value;
            const title = document.getElementById('title').value || 'グラフ';
            const xlabel = document.getElementById('xlabel').value || '';
            const ylabel = document.getElementById('ylabel').value || '';
            const color = document.getElementById('color').value || '#667eea';

            // 破棄
            if (myChart) myChart.destroy();

            // グラフデータ設定
            const ctx = document.getElementById('myChart').getContext('2d');
            const config = {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: title,
                        data: values,
                        backgroundColor: type === 'pie' || type === 'doughnut' || type === 'polarArea' ?
                            generateColors(values.length) : hexToRGBA(color, 0.2),
                        borderColor: type === 'line' ? color : (type === 'bar' ? color : '#fff'),
                        borderWidth: 2,
                        pointBackgroundColor: color,
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        fill: type === 'line' ? true : false,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: {
                            display: true,
                            text: title,
                            font: { size: 20, weight: 'bold' },
                            color: '#333'
                        },
                        legend: {
                            display: type === 'pie' || type === 'doughnut' ? true : true,
                            position: 'bottom',
                            labels: { color: '#555' }
                        }
                    },
                    scales: type === 'pie' || type === 'doughnut' ? {} : {
                        x: {
                            title: { display: xlabel.length > 0, text: xlabel, color: '#555' },
                            grid: { color: '#eee' }
                        },
                        y: {
                            title: { display: ylabel.length > 0, text: ylabel, color: '#555' },
                            grid: { color: '#eee' },
                            beginAtZero: true
                        }
                    }
                }
            };

            // 散布図・バブル対応
            if (type === 'scatter') {
                const scatterData = labels.map((lab, i) => ({ x: lab, y: values[i] }));
                config.data.datasets[0].data = scatterData;
            }
            if (type === 'bubble') {
                const bubbleData = labels.map((lab, i) => ({ x: i + 1, y: values[i], r: Math.abs(values[i]) % 20 + 4 }));
                config.data.datasets[0].data = bubbleData;
            }

            myChart = new Chart(ctx, config);

            // 統計表示
            let total = values.reduce((sum, v) => sum + v, 0);
            let avg = (total / values.length).toFixed(1);
            document.getElementById('stats').textContent = `データ数：${values.length}件 | 合計：${total} | 平均：${avg}`;
        }

        // 色生成（多色）
        function generateColors(n) {
            const colors = [];
            const hueStep = 360 / n;
            for (let i = 0; i < n; i++) {
                const hue = i * hueStep;
                colors.push(`hsl(${hue}, 70%, 60%)`);
            }
            return colors;
        }

        // hex → rgba変換
        function hexToRGBA(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // ランダムデータ生成
        function randomData() {
            const n = Math.floor(Math.random() * 8) + 3; // 3〜10件
            const lines = [];
            for (let i = 0; i < n; i++) {
                const label = `項目${i + 1}`;
                const value = Math.floor(Math.random() * 100) + 10;
                lines.push(`${label}, ${value}`);
            }
            document.getElementById('dataInput').value = lines.join('\n');
            updateChart();
        }

        // サンプルデータ（売上データなど）
        function addSampleData() {
            const sample = `1月, 120
2月, 150
3月, 170
4月, 110
5月, 200
6月, 180
7月, 240
8月, 210
9月, 130
10月, 190
11月, 220
12月, 280`;
            document.getElementById('dataInput').value = sample;
            document.getElementById('title').value = '年間売上推移';
            document.getElementById('xlabel').value = '月';
            document.getElementById('ylabel').value = '売上（万円）';
            updateChart();
        }

        // PNG保存
        function exportPNG() {
            if (!myChart) {
                alert('グラフがありません');
                return;
            }
            const link = document.createElement('a');
            link.download = 'グラフ.png';
            link.href = myChart.toBase64Image();
            link.click();
        }
    </script>
</body>
</html>
